<style>
        /* Custom Claymorphic Styles */
        .clay-btn {
            box-shadow: inset 0 -4px 0 0 rgba(0,0,0,0.2), 0 4px 10px rgba(255, 140, 66, 0.3);
            transition: all 0.15s ease;
        }
        .clay-btn:active {
            transform: translateY(2px);
            box-shadow: inset 0 -2px 0 0 rgba(0,0,0,0.2), 0 2px 5px rgba(255, 140, 66, 0.3);
        }
        .clay-card {
            box-shadow: inset 0 -3px 0 0 rgba(0,0,0,0.05), 0 8px 20px rgba(255, 140, 66, 0.05);
            border: 2px solid #fff;
        }
        .clay-track-node {
            box-shadow: inset 0 -3px 0 0 rgba(0,0,0,0.15), 0 4px 8px rgba(0,0,0,0.05);
        }
        
        .track-line {
            position: absolute;
            width: 4px;
            background: #e4e3db;
            z-index: 0;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 4px;
        }
        .track-line-active {
            background: #51fac1;
        }

        /* SVG Squiggle Path (Fallback if CSS lines aren't playful enough) */
        .svg-track {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
    </style>

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col relative pb-[100px]">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-background z-40">
<div class="flex justify-between items-center px-container-margin py-unit">
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-high text-on-surface-variant hover:opacity-80 active:translate-y-0.5 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_back</span>
</button>
<h1 class="font-display-hero text-headline-lg-mobile text-primary tracking-tight">Sóc Nâu Đồng Hành</h1>
<div class="flex items-center gap-1 bg-surface-container-high px-3 py-1.5 rounded-full">
<span class="font-label-caps text-label-caps text-primary">125</span>
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-grow px-container-margin py-unit flex flex-col gap-6 relative">
<!-- Sóc Nâu Greeting -->
<div class="relative bg-surface-container-lowest rounded-3xl p-6 clay-card flex flex-col items-center mt-4">
<!-- Decorative character image placement -->
<div class="w-24 h-24 -mt-16 mb-2 rounded-full overflow-hidden border-4 border-surface-container-lowest shadow-sm z-10 bg-primary-fixed">
<img class="w-full h-full object-cover" data-alt="A highly detailed, 3D clay-style illustration of a cute, friendly brown squirrel character named Sóc Nâu. The squirrel is smiling brightly, wearing a tiny explorer's hat, set against a solid warm orange background. The lighting is soft and studio-like, creating a tactile, pressable toy-like appearance, perfect for a preschool app." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBsXgQTpHb_Rk8d7Pb0DjFTOwpJVnx6MQZJD4PhnFbqcRV67In6pMaCxlHtHmXTg1sOQhJWwt1SyUkzuZggRVTQwYeNUNc2v4z8i-xOfQ4OR5CkOxjPMNAAQ6elXmB4s48IZeEsmuPomwZ-D-6u3PwmOurhmhw9cAAmYkHMZrRssQDDcA9eGq17WPgKOEmaJuRo5Jpymp4ftxzDHKRGXT9p0TDypLRBYaykQuWJpV7-REk3J-UNs9QGRA"/>
</div>
<div class="bg-inverse-primary rounded-2xl p-4 w-full relative mb-4">
<!-- Speech bubble tail -->
<div class="absolute -top-3 left-1/2 transform -translate-x-1/2 w-0 h-0 border-l-[10px] border-l-transparent border-r-[10px] border-r-transparent border-b-[15px] border-b-inverse-primary"></div>
<p class="font-title-md text-title-md text-on-primary-fixed-variant text-center">
                    Chào bé! Hôm nay chúng ta cùng bắt đầu hành trình mới nhé!
                </p>
<button class="absolute top-2 right-2 w-8 h-8 rounded-full bg-surface-container-lowest flex items-center justify-center text-primary-container hover:scale-105 active:scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</button>
</div>
</div>
<!-- Progress Track (The Roadmap) -->
<div class="relative flex flex-col items-center py-8 z-10">
<!-- Track Line -->
<div class="track-line h-full top-0"></div>
<!-- Completed portion of track -->
<div class="track-line track-line-active h-[20%] top-0"></div>
<div class="w-full max-w-sm flex flex-col gap-12 relative z-10">
<!-- Node 1: Completed -->
<div class="flex items-center gap-4 group">
<div class="w-16 h-16 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center clay-track-node flex-shrink-0 z-10">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="bg-surface-container-lowest rounded-2xl p-4 flex-grow clay-card opacity-80 flex justify-between items-center">
<div>
<span class="font-label-caps text-label-caps text-on-surface-variant block mb-1">Hoàn thành</span>
<h3 class="font-title-md text-[18px] leading-[24px] text-on-background">Khởi động (Vận động tinh)</h3>
</div>
<span class="material-symbols-outlined text-secondary-container" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
</div>
<!-- Node 2: Active -->
<div class="flex items-center gap-4 -ml-4 group"> <!-- Slight offset for organic feel -->
<div class="w-[72px] h-[72px] rounded-full bg-primary-container text-on-primary flex items-center justify-center clay-track-node flex-shrink-0 z-10 border-4 border-surface-container-lowest animate-pulse">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">edit</span>
</div>
<div class="bg-surface-container-lowest rounded-2xl p-4 flex-grow clay-card border-primary-container border-2 flex justify-between items-center transform scale-105 transition-transform">
<div>
<span class="font-label-caps text-label-caps text-primary block mb-1">Đang học</span>
<h3 class="font-title-md text-title-md text-on-background">Vẽ nét (Chữ A)</h3>
</div>
<span class="material-symbols-outlined text-primary-container text-3xl">play_circle</span>
</div>
</div>
<!-- Node 3: Locked -->
<div class="flex items-center gap-4 ml-4 group">
<div class="w-14 h-14 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center clay-track-node flex-shrink-0 z-10 opacity-70">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<div class="bg-surface-container rounded-2xl p-4 flex-grow opacity-60">
<h3 class="font-title-md text-[18px] leading-[24px] text-on-surface-variant">Nhận biết (Chữ cái/Âm)</h3>
</div>
</div>
<!-- Node 4: Locked -->
<div class="flex items-center gap-4 group">
<div class="w-14 h-14 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center clay-track-node flex-shrink-0 z-10 opacity-70">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<div class="bg-surface-container rounded-2xl p-4 flex-grow opacity-60">
<h3 class="font-title-md text-[18px] leading-[24px] text-on-surface-variant">Tư duy &amp; Logic</h3>
</div>
</div>
<!-- Node 5: Locked -->
<div class="flex items-center gap-4 -ml-2 group">
<div class="w-14 h-14 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center clay-track-node flex-shrink-0 z-10 opacity-70">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<div class="bg-surface-container rounded-2xl p-4 flex-grow opacity-60">
<h3 class="font-title-md text-[18px] leading-[24px] text-on-surface-variant">Khám phá thế giới</h3>
</div>
</div>
<!-- Node 6: Locked -->
<div class="flex items-center gap-4 ml-2 group">
<div class="w-14 h-14 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center clay-track-node flex-shrink-0 z-10 opacity-70">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<div class="bg-surface-container rounded-2xl p-4 flex-grow opacity-60 flex justify-between items-center">
<h3 class="font-title-md text-[18px] leading-[24px] text-on-surface-variant">Kỹ năng sống</h3>

<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">play_arrow</span>

            </button>
</div>

<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-xl bg-surface-container-lowest border-t-4 border-surface-variant shadow-lg hidden md:hidden flex justify-around items-end pb-4 pt-2 px-2" style="display: flex;">
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-6 py-2 border-b-4 border-on-primary-container hover:bg-secondary-container active:scale-95 transition-all duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-caps text-label-caps mt-1">Trang chủ</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-secondary-container active:scale-95 transition-all duration-150 rounded-2xl">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">edit_square</span>
<span class="font-label-caps text-label-caps mt-1">Bài tập</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-secondary-container active:scale-95 transition-all duration-150 rounded-2xl">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<span class="font-label-caps text-label-caps mt-1">Quà tặng</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-secondary-container active:scale-95 transition-all duration-150 rounded-2xl">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">family_history</span>
<span class="font-label-caps text-label-caps mt-1">Phụ huynh</span>
</button>
</nav>
