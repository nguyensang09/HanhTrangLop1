<!-- Let's assume standard stroke order for 5: 1. Down, 2. Curve, 3. Top Line -->

<polygon fill="var(--tw-colors-secondary)" points="55,16 55,24 65,20"></polygon>
<text class="font-path-number text-path-number" fill="var(--tw-colors-secondary)" x="50" y="10">3</text>
