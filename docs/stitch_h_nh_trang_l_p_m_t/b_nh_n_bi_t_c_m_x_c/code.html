<!-- Lightweight JS for Selection Interaction -->
<script>
        function selectEmotion(clickedElement) {
            // Remove selected class and reset shadow from all buttons
            const buttons = document.querySelectorAll('.grid button');
            buttons.forEach(btn => {
                btn.classList.remove('selected-card');
                btn.style.boxShadow = '0 6px 0 0 #bfe8ff'; // Reset to tertiary-fixed shadow
                btn.style.transform = 'translateY(0)';
            });

            // Add selected class to the clicked button
            clickedElement.classList.add('selected-card');
            
            // Adjust visual state to look pressed and selected
            clickedElement.style.boxShadow = '0 2px 0 0 #006686'; // Darker shadow for pressed state
            clickedElement.style.transform = 'translateY(4px)';

            // Optional: Play a soft pop sound or trigger the next logic here
        }
    </script>
