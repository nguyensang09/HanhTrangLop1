<script>
        // Simple logic to handle visual selection of clay cards
        const options = document.querySelectorAll('.option-btn');
        options.forEach(btn => {
            btn.addEventListener('click', () => {
                // Reset all
                options.forEach(b => {
                    b.classList.remove('selected');
                    const indicator = b.querySelector('.indicator');
                    indicator.classList.remove('bg-tertiary-container', 'border-tertiary-container');
                    indicator.classList.add('border-outline-variant');
                    indicator.querySelector('span').classList.remove('text-on-tertiary-container');
                    indicator.querySelector('span').classList.add('text-transparent');
                });
                
                // Set active
                btn.classList.add('selected');
                const indicator = btn.querySelector('.indicator');
                indicator.classList.add('bg-tertiary-container', 'border-tertiary-container');
                indicator.classList.remove('border-outline-variant');
                indicator.querySelector('span').classList.add('text-on-tertiary-container');
                indicator.querySelector('span').classList.remove('text-transparent');
            });
        });
    </script>
