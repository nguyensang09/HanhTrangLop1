<style>
        @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap');
        
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Breathing Animation Sequence */
        @keyframes breathe {
            0%   { transform: scale(1); background-color: #53b5df; } /* tertiary-container */
            40%  { transform: scale(1.6); background-color: #51fac1; } /* secondary-container - full inhale */
            60%  { transform: scale(1.6); background-color: #51fac1; } /* hold */
            100% { transform: scale(1); background-color: #53b5df; } /* exhale back */
        }

        .balloon-animate {
            animation: breathe 8s ease-in-out infinite;
        }

        /* Inner glow for tactile feel */

            box-shadow: inset 0 4px 10px rgba(255,255,255,0.6), inset 0 -4px 10px rgba(0,0,0,0.05);

<!-- Interactive Logic Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const step1 = document.getElementById('step-1');
            const step2 = document.getElementById('step-2');
            const step3 = document.getElementById('step-3');
            const balloon = document.getElementById('breathing-balloon');
            const toggleBtn = document.getElementById('toggle-breathing');
            let isPlaying = true;
            let cycleInterval;

            // Define timing based on CSS animation (8s total)
            // 0-40% (0-3.2s) : Inhale
            // 40-60% (3.2s-4.8s): Hold
            // 60-100% (4.8s-8.0s): Exhale
            
            function updateSteps(timeInCycle) {
                if(!isPlaying) return;
                
                step1.classList.remove('step-active');
                step2.classList.remove('step-active');
                step3.classList.remove('step-active');

                if (timeInCycle < 3200) {
                    step1.classList.add('step-active');
                } else if (timeInCycle >= 3200 && timeInCycle < 4800) {
                    step2.classList.add('step-active');
                } else {
                    step3.classList.add('step-active');
                }
            }

            let startTime = Date.now();
            function loop() {
                if(isPlaying) {
                    const now = Date.now();
                    const elapsed = (now - startTime) % 8000;
                    updateSteps(elapsed);
                }
                requestAnimationFrame(loop);
            }
            
            // Start the loop
            requestAnimationFrame(loop);

            toggleBtn.addEventListener('click', () => {
                isPlaying = !isPlaying;
                if(isPlaying) {
                    balloon.style.animationPlayState = 'running';
                    toggleBtn.innerHTML = '<span class="material-symbols-outlined">pause</span> Tạm Dừng';
                    // Reset visual steps instantly based on animation state would be complex here, 
                    // just let loop pick it up.
                } else {
                    balloon.style.animationPlayState = 'paused';
                    toggleBtn.innerHTML = '<span class="material-symbols-outlined">play_arrow</span> Tiếp Tục';
                    step1.classList.remove('step-active');
                    step2.classList.remove('step-active');
                    step3.classList.remove('step-active');
                }
            });
        });
    </script>
