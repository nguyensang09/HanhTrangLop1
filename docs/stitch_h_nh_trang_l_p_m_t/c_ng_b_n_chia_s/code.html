<style>
        .clay-button {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .clay-button:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 0 0 0 transparent !important;
        }
        .clay-button.selected-correct {
            background-color: #51fac1; /* secondary-container */
            border-color: #006c4f; /* secondary */
            box-shadow: 0 0 0 0 transparent !important;
            transform: translateY(4px);
            color: #007152; /* on-secondary-container */
        }
        .clay-button.selected-wrong {
            background-color: #ffdad6; /* error-container */
            border-color: #ba1a1a; /* error */
            box-shadow: 0 0 0 0 transparent !important;
            transform: translateY(4px);
            color: #93000a; /* on-error-container */
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 4px, 0); }
            20%, 80% { transform: translate3d(2px, 4px, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 4px, 0); }
            40%, 60% { transform: translate3d(4px, 4px, 0); }
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .feedback-pop {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col overflow-x-hidden selection:bg-tertiary-fixed selection:text-on-tertiary-fixed">

<main class="flex-1 flex flex-col px-container-margin py-6 pb-[100px]">

<!-- Progress Bar -->

</div>
</div>
<!-- Sóc Nâu Dialogue / Instruction -->
<div class="bg-primary-fixed rounded-xl p-4 mb-6 shadow-[0_4px_0_0_rgba(155,69,0,0.1)] flex items-start gap-4 border-2 border-inverse-primary relative">
<div class="w-12 h-12 bg-surface-bright rounded-full flex-shrink-0 border-2 border-primary-container shadow-sm flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">cruelty_free</span>
</div>
<div class="flex-1 pt-1">
<p class="font-title-md text-title-md text-on-primary-fixed-variant leading-tight">

</div>
<!-- Decorative speech bubble tail -->
<div class="absolute -left-2 top-6 w-4 h-4 bg-primary-fixed border-l-2 border-b-2 border-inverse-primary transform rotate-45"></div>
</div>
<!-- Interactive Scene Illustration -->
<div class="w-full h-56 rounded-2xl bg-surface-container-high mb-8 relative overflow-hidden shadow-[0_8px_20px_rgba(255,140,66,0.08)] border-4 border-surface-bright" data-alt="A heartwarming, softly lit 3D claymorphic illustration of a cute brown squirrel character named Sóc Nâu and a friendly rabbit character looking at a single brightly colored toy wooden train. They are standing in a warm, inviting playroom with cream-colored walls and soft lighting. The style is gentle, tactile, and designed for preschoolers, featuring rounded edges, pastel accents, and no harsh outlines. The mood is curious and cooperative, encouraging learning through play." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDK6rZjozZynulWuPZSsHbn9j-VW7hv9QWSGaTW_UxeCviqtb4X5qTSC_ORkGrTXbIe3pBJS7xFMD7-g2V2Y9s1gQ6EY7Gcbp2xHhvbbCFxgPAe-6elFMJjxLTdqp9iT4w9yI6Kn8pd5xEdZpQjN56YjReDc7WRtwsNNWfUSXeTQ2-wec0xo3_Ln1CrWnPlTmQZZgWnDnm9DoDui5PaZ_hlfW9Sd6yDX18li_uA9__gn_dQlqwBr75_gA'); background-size: cover; background-position: center;">
<!-- Feedback Overlay (Hidden by default) -->
<div class="absolute inset-0 bg-surface-bright/80 backdrop-blur-sm hidden flex-col items-center justify-center z-10" id="feedback-overlay">
<div class="text-center opacity-0 transform scale-50 transition-all duration-300" id="feedback-content">
<span class="material-symbols-outlined text-[64px] text-secondary mb-2 drop-shadow-md" id="feedback-icon" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface" id="feedback-text">Giỏi quá!</h3>
</div>
</div>
</div>
<!-- Multiple Choice Options -->
<div class="flex flex-col gap-card-gap" id="options-container">
<!-- Option 1: Correct -->
<button class="clay-button w-full bg-surface-bright border-2 border-outline-variant shadow-[0_4px_0_0_#ddc1b3] rounded-xl p-4 flex items-center justify-between text-left group" data-correct="true">

</button>

</button>

</button>

<!-- Active Tab: Học Tập -->

<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">school</span>
<span class="font-label-caps text-[12px] mt-1 whitespace-nowrap">Học Tập</span>
</button>
<!-- Inactive Tab: Vui Chơi -->

</button>
<!-- Inactive Tab: Thử Thách -->

<span class="font-label-caps text-[12px] mt-1 whitespace-nowrap">Thử Thách</span>
</button>
<!-- Inactive Tab: Của Bé -->
<button class="flex flex-col items-center justify-center text-on-surface-variant opacity-70 hover:bg-surface-container-high rounded-xl px-2 py-1 min-w-[72px] h-[56px] active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 0;">person</span>
<span class="font-label-caps text-[12px] mt-1 whitespace-nowrap">Của Bé</span>
</button>
</nav>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('.clay-button');
            const overlay = document.getElementById('feedback-overlay');
            const feedbackContent = document.getElementById('feedback-content');
            const feedbackIcon = document.getElementById('feedback-icon');
            const feedbackText = document.getElementById('feedback-text');

            buttons.forEach(button => {
                button.addEventListener('click', function() {
                    // Reset all buttons
                    buttons.forEach(btn => {
                        btn.classList.remove('selected-correct', 'selected-wrong');
                        btn.disabled = true; // Disable temporarily during feedback
                    });

                    const isCorrect = this.getAttribute('data-correct') === 'true';

                    if (isCorrect) {
                        this.classList.add('selected-correct');
                        
                        // Show success overlay
                        overlay.classList.remove('hidden');
                        overlay.classList.add('flex');
                        feedbackIcon.textContent = 'star';
                        feedbackIcon.className = 'material-symbols-outlined text-[64px] text-primary-container mb-2 drop-shadow-md';
                        feedbackText.textContent = 'Tuyệt vời!';
                        
                        setTimeout(() => {
                            feedbackContent.classList.add('feedback-pop');
                            feedbackContent.classList.remove('opacity-0', 'scale-50');
                        }, 50);

                    } else {
                        this.classList.add('selected-wrong');
                        
                        // Mild feedback for wrong answer (no harsh overlay, just button shake)
                        setTimeout(() => {
                            this.classList.remove('selected-wrong');
                            buttons.forEach(btn => btn.disabled = false);
                        }, 800);
                    }
                });
            });
        });
    </script>
