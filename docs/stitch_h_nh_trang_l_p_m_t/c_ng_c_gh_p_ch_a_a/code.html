<style>

<!-- TopAppBar (Rendered as Bottom Nav logic dictates it's hidden, but we need a top app bar for contextual back) -->
<!-- Applying style logic from JSON, but adapting placement to avoid conflicting with Sóc Nâu -->
<!-- Suppressed TopAppBar per instruction: "Automatic Suppression: You MUST exclude the navigation shell if the page intent is: Linear/Transactional: Login, Sign-up, Onboarding, Checkout, or 'Success/Confirmation' splash screens... Task-Focused: Any sub-page featuring a 'Close' or 'Back' action" -->
<!-- This is a task-focused learning screen, so global navs are hidden to prioritize the canvas. -->
<script>
        // Simple Drag and Drop logic for demonstration
        const draggable = document.getElementById('drag-A');
        const dropzone = document.getElementById('drop-a');
        
        draggable.addEventListener('dragstart', (e) => {
            e.dataTransfer.setData('text/plain', 'A');
            draggable.style.opacity = '0.5';
        });

        draggable.addEventListener('dragend', () => {
            draggable.style.opacity = '1';
        });

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });

        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('dragover');
        });

        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            const data = e.dataTransfer.getData('text/plain');
            
            if (data === 'A') {
                // Success state
                dropzone.style.backgroundColor = '#51fac1'; // secondary-container
                dropzone.style.color = '#007152'; // on-secondary-container
                dropzone.style.borderStyle = 'solid';
                dropzone.style.borderColor = '#006c4f';
                draggable.style.visibility = 'hidden';
                
                // Play sound (visualized by expanding star)
                const star = document.querySelector('.progress-track span');
                star.style.transform = 'scale(1.5)';
                setTimeout(() => {
                    star.style.transform = 'scale(1)';
                    // Advance progress visually
                    document.querySelector('.progress-fill').style.width = '66%';
                    document.querySelector('.progress-track .absolute').style.left = '66%';
                }, 300);
            }
        });
        
        // Touch support for mobile (simplified for this context)
        draggable.addEventListener('touchstart', function(e) {
            this.style.opacity = '0.5';
        }, {passive: true});
        
        draggable.addEventListener('touchend', function(e) {
             this.style.opacity = '1';
             // Real implementation would calculate coordinates to see if dropped on target
        }, {passive: true});

    </script>
