<!-- Navigation is intentionally omitted as this is a focused learning task -->
<script>
        let hasCorrectSelection = false;

        function selectCard(cardElement, isCorrect) {
            if (hasCorrectSelection) return; // Prevent changing answer after correct one is found
            
            // Reset all cards
            document.querySelectorAll('.option-card').forEach(card => {
                card.classList.remove('selected-correct', 'border-error', 'bg-error-container', 'opacity-50');
                card.querySelector('.feedback-icon').classList.add('hidden');
            });

            if (isCorrect) {
                // Apply correct state
                cardElement.classList.add('selected-correct');
                cardElement.querySelector('.feedback-icon').classList.remove('hidden');
                hasCorrectSelection = true;
                
                // Dim other cards
                document.querySelectorAll('.option-card:not(.selected-correct)').forEach(card => {
                    card.classList.add('opacity-50', 'pointer-events-none');
                });

                // Enable complete button
                const btn = document.getElementById('completeBtn');
                btn.classList.remove('opacity-50', 'cursor-not-allowed', 'pointer-events-none');
                btn.classList.add('bounce-in');
            } else {
                // Apply wrong state briefly
                cardElement.classList.add('border-error', 'bg-error-container');
                cardElement.querySelector('.feedback-icon').classList.remove('hidden');
                
                // Shake effect (inline simple css class logic)
                cardElement.style.transform = 'translateX(-10px)';
                setTimeout(() => cardElement.style.transform = 'translateX(10px)', 100);
                setTimeout(() => cardElement.style.transform = 'translateX(-10px)', 200);
                setTimeout(() => cardElement.style.transform = 'translateX(0)', 300);
                
                setTimeout(() => {
                    if(!hasCorrectSelection){
                        cardElement.classList.remove('border-error', 'bg-error-container');
                        cardElement.querySelector('.feedback-icon').classList.add('hidden');
                    }
                }, 800);
            }
        }
    </script>
