<style>
        .star-pulse {
            animation: pulse-star 1.5s infinite alternate;
        }
        @keyframes pulse-star {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(255,140,66,0.4)); }
            100% { transform: scale(1.15); filter: drop-shadow(0 0 20px rgba(255,140,66,0.8)); }
        }
        .clay-btn {
            border-bottom-width: 6px;
            border-color: #763300; /* on-primary-fixed-variant */
            transition: all 0.15s ease-in-out;
        }
        .clay-btn:active {
            transform: translateY(4px);
            border-bottom-width: 2px;
        }
        .bounce-in {
            animation: bounceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }
        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .float-animation {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
