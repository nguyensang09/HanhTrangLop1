<style>

            border-bottom-width: 4px;
            transition: all 0.1s ease-in-out;
        }
        .pressable-btn:active {
            transform: translateY(2px);
            border-bottom-width: 0px;
            margin-top: 4px;
        }
        .clay-avatar {
            box-shadow: 0px -4px 20px 0px rgba(255,140,66,0.05), inset 0px -4px 0px 0px rgba(0,0,0,0.1);
            transition: transform 0.2s ease;
        }
        .clay-avatar:active {
            transform: scale(0.95);
        }
        .bg-pattern {
             background-color: #fbf9f1;
             background-image: radial-gradient(#ddc1b3 1px, transparent 1px);
             background-size: 24px 24px;
        }

<body class="bg-pattern min-h-screen text-on-surface font-body-md flex flex-col items-center justify-center relative pb-24 md:pb-0">
<!-- Header / Parental Gate -->
<header class="fixed top-0 left-0 w-full p-container-margin flex justify-end z-50">
<button aria-label="Parental Gate" class="w-16 h-16 rounded-full bg-surface-container-high border-4 border-surface-container flex items-center justify-center pressable-btn border-surface-dim shadow-sm">
<span class="material-symbols-outlined text-outline text-[32px]" style="font-variation-settings: 'FILL' 0, 'wght' 600;">
                lock
            </span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-2xl px-container-margin pt-24 pb-12 flex flex-col items-center text-center relative z-10">
<h1 class="font-display-hero text-display-hero text-primary mb-2 md:mb-4">Ai đang chơi nhỉ?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-12">Chọn tên của bé để bắt đầu học nhé!</p>
<!-- Profile Grid -->
<div class="grid grid-cols-2 md:grid-cols-3 gap-8 md:gap-12 w-full max-w-xl">
<!-- Avatar 1 -->
<button class="flex flex-col items-center group">
<div class="w-32 h-32 md:w-40 md:h-40 rounded-full bg-tertiary-fixed border-4 border-white clay-avatar flex items-center justify-center mb-4 overflow-hidden relative">
<img class="w-full h-full object-cover" data-alt="A cute 3D cartoon style illustration of a strawberry with a happy face, suitable for a preschool app profile picture. The style is soft, bright, and clay-like with warm pastel colors on a light blue background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBXQ93FZBWeV_DPKd0Radp1F3xRwQ1euZa82hfHTALr7WvxFDM2m2Hfda3UnlWD-LHRfQ9ErDJ3Ik4nU54JIJnLUC7K8Yd2wNzAYX1ToItTKyuE8CULb-v3-nNCVND1LTJP5rG0gp_TjOFi410OkoZq-o-gD5vgkv6BHfzuxB8gUGA1oCiPsaUTUMBpYyT04RjeFGAjjIaEY2sjJlZWEokekKGGPOGquV6nXK7-WmNZOG1GbCTIFaFNZA"/>
</div>
<span class="font-title-md text-title-md text-on-surface group-hover:text-primary transition-colors">Bé Dâu Tây</span>
</button>
<!-- Avatar 2 -->
<button class="flex flex-col items-center group">
<div class="w-32 h-32 md:w-40 md:h-40 rounded-full bg-secondary-fixed border-4 border-white clay-avatar flex items-center justify-center mb-4 overflow-hidden relative">
<img class="w-full h-full object-cover" data-alt="A cute 3D cartoon style illustration of a green avocado with a happy face, suitable for a preschool app profile picture. The style is soft, bright, and clay-like with warm pastel colors on a light green background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCDh2RF_1zoJBNBXuHC9PSA1uCEit4L2ZAGEL9YsNiEdsR6V99laVjQ_cJlZ6Z2cQB3l13Qvpl61ETkw5GsCDb9BHndniwLYUUuooAl--mPq-heMxdxmvv-TDPP9Q4VS_2z1LxhnofWrjV5-2-YsmpXVPw3xFVNM2i12lNyAoTvfShAGDC8hIax-LaB2Kns0NvtO0xkI2IeCNMXmtcsKCzN9HW_hUWg8cCb5PaqB0xWMGi2lAF1mis3fw"/>
</div>
<span class="font-title-md text-title-md text-on-surface group-hover:text-primary transition-colors">Bé Bơ</span>
</button>
<!-- Add Profile -->
<button class="flex flex-col items-center group">
<div class="w-32 h-32 md:w-40 md:h-40 rounded-full bg-surface-container-high border-4 border-dashed border-outline-variant clay-avatar flex items-center justify-center mb-4 relative hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-outline-variant text-[48px]" style="font-variation-settings: 'FILL' 1, 'wght' 700;">
                        add
                    </span>
</div>
<span class="font-title-md text-title-md text-on-surface-variant group-hover:text-primary transition-colors">Thêm Bé</span>
</button>
</div>
