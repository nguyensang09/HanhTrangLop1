<script>
        // Simple logic to show the question mark and selection area after the item fades out
        setTimeout(() => {
            const questionMark = document.getElementById('question-mark');
            const selectionArea = document.getElementById('selection-area');
            
            if(questionMark) {
                questionMark.style.opacity = '1';
                questionMark.classList.add('pop-in');
            }
            if(selectionArea) {
                selectionArea.style.opacity = '1';
            }
        }, 3000); // 1s delay + 2s animation time
    </script>
