<style>

</button>

<script>
        function selectLevel(element, level) {
            // Remove active classes from all cards
            const cards = document.querySelectorAll('button[onclick^="selectLevel"]');
            cards.forEach(card => {
                card.classList.remove('clay-card-active', 'border-primary-container');
                card.classList.add('clay-card-inactive', 'border-transparent');
                
                // Reset title color
                const title = card.querySelector('h3');
                if(title) title.classList.replace('text-primary', 'text-on-surface');
            });

            // Add active class to clicked card
            element.classList.remove('clay-card-inactive', 'border-transparent');
            element.classList.add('clay-card-active', 'border-primary-container');
            
            // Highlight title
            const title = element.querySelector('h3');
            if(title) {
                title.classList.remove('text-on-surface');
                title.classList.add('text-primary');
            }
        }
    </script>
