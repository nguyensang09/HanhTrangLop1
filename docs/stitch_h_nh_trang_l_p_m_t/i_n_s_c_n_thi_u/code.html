<script>
        // Simple drag and drop visual feedback script (non-functional logic, just UX)
        const draggables = document.querySelectorAll('.draggable');
        const dropZone = document.getElementById('dropZone');

        draggables.forEach(draggable => {
            draggable.addEventListener('dragstart', () => {
                draggable.classList.add('opacity-50');
                dropZone.classList.add('bg-tertiary-container/30', 'border-tertiary');
            });

            draggable.addEventListener('dragend', () => {
                draggable.classList.remove('opacity-50');
                dropZone.classList.remove('bg-tertiary-container/30', 'border-tertiary');
                dropZone.classList.remove('active');
            });
        });

        dropZone.addEventListener('dragover', e => {
            e.preventDefault();
            dropZone.classList.add('active');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('active');
        });

        dropZone.addEventListener('drop', () => {
            // In a real app, logic goes here to check if it's correct.
            // For UI purposes, just visual reset
            dropZone.classList.remove('active');
            dropZone.innerHTML = '<span class="font-display-hero text-display-hero text-tertiary font-bold">3</span>';
            dropZone.classList.remove('border-dashed', 'border-4');
            dropZone.classList.add('bg-secondary-container', 'border-b-4', 'border-secondary-fixed-dim', 'shadow-inner');
