<script>
        // Simple drag and drop logic for visual feedback
        const items = document.querySelectorAll('.draggable-item');
        const target = document.getElementById('backpack-target');
        const highlight = document.getElementById('drop-highlight');

        items.forEach(item => {
            item.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', e.target.dataset.type);
                setTimeout(() => item.classList.add('opacity-50'), 0);
            });
            item.addEventListener('dragend', () => {
                item.classList.remove('opacity-50');
            });
        });

        target.addEventListener('dragover', (e) => {
            e.preventDefault();
            highlight.classList.remove('opacity-0');
            highlight.classList.add('opacity-50');
        });

        target.addEventListener('dragleave', () => {
            highlight.classList.add('opacity-0');
            highlight.classList.remove('opacity-50');
        });

        target.addEventListener('drop', (e) => {
            e.preventDefault();
            highlight.classList.add('opacity-0');
            highlight.classList.remove('opacity-50');
            const type = e.dataTransfer.getData('text/plain');
            
            if (type === 'correct') {
                // Visual feedback for correct
                target.classList.add('bg-secondary-container', 'border-secondary');
                setTimeout(() => {
                    target.classList.remove('bg-secondary-container', 'border-secondary');
                }, 1000);
            } else {
                 // Visual feedback for incorrect
                 target.classList.add('bg-error-container', 'border-error');
                 setTimeout(() => {
                    target.classList.remove('bg-error-container', 'border-error');
                }, 1000);
            }
        });
    </script>
