<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Khám phá chữ cái</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",

                extend: {
                    "colors": {
                        "tertiary-fixed": "#bfe8ff",

                        "surface-container-low": "#f5f4ec",
                        "outline": "#897266",
                        "inverse-on-surface": "#f3f1e9",
                        "on-secondary-container": "#007152",
                        "on-secondary": "#ffffff",
                        "on-surface-variant": "#564338",
                        "surface-variant": "#e4e3db",
                        "background": "#fbf9f1",
                        "tertiary-fixed-dim": "#73d2fd",
                        "surface-container": "#f0eee6",
                        "primary-fixed": "#ffdbc9",
                        "tertiary": "#006686",
                        "tertiary-container": "#53b5df",
                        "on-tertiary-fixed-variant": "#004d65",
                        "surface-container-lowest": "#ffffff",
                        "surface-bright": "#fbf9f1",
                        "secondary-fixed-dim": "#27e0a9",
                        "secondary": "#006c4f",

                        "on-tertiary-container": "#00445a",
                        "on-secondary-fixed-variant": "#00513b",

                        "surface": "#fbf9f1",
                        "on-primary-container": "#6a2d00",
                        "inverse-primary": "#ffb68d",
                        "surface-tint": "#9b4500",
                        "secondary-container": "#51fac1",
                        "on-tertiary-fixed": "#001f2a",

                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "touch-target-min": "48px",
                        "unit": "8px",
                        "container-margin": "24px",
                        "card-gap": "20px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "title-md": ["Be Vietnam Pro"],
                        "body-lg": ["Be Vietnam Pro"],
                        "body-md": ["Be Vietnam Pro"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "label-caps": ["Plus Jakarta Sans"],
                        "display-hero": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "title-md": ["22px", { "lineHeight": "30px", "fontWeight": "600" }],
                        "body-lg": ["20px", { "lineHeight": "32px", "fontWeight": "500" }],
                        "body-md": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],

                        "display-hero": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "800" }]

            }

<style>
        .pressable-btn {
            border-bottom-width: 4px;
            transition: all 0.1s ease-in-out;
        }
        .pressable-btn:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
            margin-bottom: 2px;
        }
        .soft-shadow {
            box-shadow: 0 4px 20px rgba(255, 140, 66, 0.05);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen pb-24 font-body-md">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-background dark:bg-surface-dim z-50">
<div class="flex justify-between items-center px-container-margin py-unit w-full flat no shadows">
<button class="flex items-center justify-center min-w-[48px] min-h-[48px] text-on-surface-variant hover:bg-primary-container transition-colors rounded-full pressable-btn border-on-surface-variant">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary dark:text-primary-fixed-dim text-center">
                Sóc Nâu Học Chữ
            </h1>
<div class="flex items-center min-w-[48px] min-h-[48px] text-primary dark:text-primary-fixed-dim font-title-md text-title-md">
                ⭐ 125
            </div>
</div>
</header>
<!-- Main Content -->
<main class="px-container-margin pt-unit flex flex-col items-center max-w-2xl mx-auto space-y-card-gap">
<!-- Letter Display Area -->
<section class="w-full bg-surface-container-lowest rounded-xl soft-shadow border-2 border-tertiary-fixed flex flex-col items-center justify-center p-8 relative overflow-hidden">
<!-- Decorative Elements -->
<div class="absolute top-[-20px] right-[-20px] w-32 h-32 bg-primary-fixed rounded-full opacity-50 mix-blend-multiply blur-2xl"></div>
<div class="absolute bottom-[-20px] left-[-20px] w-32 h-32 bg-tertiary-fixed rounded-full opacity-50 mix-blend-multiply blur-2xl"></div>
<div class="flex items-baseline space-x-4 mb-6 z-10">
<span class="font-display-hero text-[120px] leading-none text-primary">B</span>
<span class="font-display-hero text-[80px] leading-none text-primary">b</span>
</div>
<div class="flex space-x-6 z-10">
<button aria-label="Nghe tên chữ" class="flex items-center justify-center w-16 h-16 bg-primary-container text-on-primary rounded-full pressable-btn border-surface-tint shadow-sm hover:scale-105">
<span class="material-symbols-outlined" data-icon="volume_up" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</button>
<button aria-label="Nghe âm chữ" class="flex items-center justify-center w-16 h-16 bg-secondary-container text-on-secondary-container rounded-full pressable-btn border-secondary shadow-sm hover:scale-105">
<span class="material-symbols-outlined" data-icon="record_voice_over" style="font-variation-settings: 'FILL' 1;">record_voice_over</span>
</button>
</div>
</section>
<!-- Illustration Area -->
<section class="w-full bg-surface-container-lowest rounded-xl soft-shadow border-2 border-tertiary-fixed p-6 flex flex-col items-center relative">
<div class="w-full aspect-[4/3] rounded-lg overflow-hidden mb-4 bg-tertiary-fixed-dim relative flex items-center justify-center">
<img class="object-cover w-full h-full absolute inset-0" data-alt="A cute, soft claymorphic 3D illustration of a friendly soft-shell turtle (Ba Ba) swimming in clear light blue water. The turtle has a gentle smile, large expressive eyes, and a smooth olive-green shell. Bright, warm lighting highlights the soft textures. Designed for young children in a preschool learning app context." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA8BQQY9rqrKmdi2eHohkAyZiAbTTkI4k8vLKUQpCRxJtfvuMT19LlnyIbG73yOKxIdY2xQcaNb8t9pQGQLlllqXGE1R7BKNsmSMu-wqQOPVfHPPXA6J3mm59NMGdWbqUWvQT3_5QAwwmlWXRKIn9_tUzOZdKhHanfYj3_xcmtur7riMj4bEFjdzkVC5xU6LSPfT3knUM5sn57P4M_iIm7G--V0uQcwRN8yiYWCmQrf5o1MLiepOIIEIg"/>
<!-- Fallback visual if image fails -->
<div class="w-3/4 h-3/4 bg-secondary-fixed-dim rounded-full flex items-center justify-center opacity-20 absolute"></div>
</div>
<div class="flex items-center space-x-3 bg-primary-fixed px-6 py-3 rounded-full border-2 border-primary-fixed-dim">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-primary-container">Ba Ba</span>
<button aria-label="Nghe từ Ba Ba" class="flex items-center justify-center w-10 h-10 bg-primary text-on-primary rounded-full pressable-btn border-surface-tint">
<span class="material-symbols-outlined" data-icon="volume_up" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</button>
</div>
</section>
<!-- Sóc Nâu Dialogue -->
<section class="w-full bg-primary-fixed-dim rounded-xl p-4 flex items-center space-x-4 border-2 border-primary-container relative">
<div class="w-16 h-16 bg-primary-container rounded-full flex-shrink-0 flex items-center justify-center overflow-hidden border-2 border-surface-lowest">
<img class="object-cover w-full h-full" data-alt="A 2D vector illustration of a cute brown squirrel character named Soc Nau, wearing a tiny red scarf. The squirrel is looking friendly and encouraging. Flat colors, soft edges, suitable for a children's educational app UI icon." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCzlLNGGcxfKBBg7tR1WKrirv3SaH2faxVIfI9CgZyuwUNS0gqcegvCXamhL8x4Mo2Ai547j4MAM2ikZ0wVtP1FVyQcETreOfHAYuNd4IV52uXcB0BBZI_kYCz21n-kOpzPG4J1nnj-X86qHW7xFXG0JLj3WuwSpqlymOqqRNvzo1wtl-Hak9Q4viBh-zwonDsxhjieJxx9s1pXTvXegj0Vy3TxAVc6HrP9wODBATodTpssthyrGGWapQ"/>
</div>
<div class="flex-1">
<p class="font-body-md text-on-primary-container font-semibold">
                    Cậu đọc theo tớ nhé: "Bờ... Ba Ba"
                </p>
</div>
<button class="w-10 h-10 flex-shrink-0 bg-primary text-on-primary rounded-full flex items-center justify-center pressable-btn border-surface-tint">
<span class="material-symbols-outlined" data-icon="play_arrow" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
<!-- Speech bubble tail -->
<div class="absolute left-8 -top-3 w-0 h-0 border-l-[10px] border-l-transparent border-r-[10px] border-r-transparent border-b-[15px] border-b-primary-container"></div>
</section>
<!-- Call to Action -->
<section class="w-full pt-4">
<button class="w-full h-16 bg-primary text-on-primary rounded-full flex items-center justify-center space-x-2 pressable-btn border-surface-tint font-headline-lg-mobile text-headline-lg-mobile hover:bg-primary-container transition-colors">
<span>Luyện tập nhanh</span>
<span class="material-symbols-outlined" data-icon="rocket_launch" style="font-variation-settings: 'FILL' 1;">rocket_launch</span>
</button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full rounded-t-xl bg-surface-container dark:bg-surface-container-highest shadow-sm z-50 md:hidden flex justify-around items-center px-4 pb-4 pt-2">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-2 hover:scale-110 transition-transform">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-caps text-label-caps mt-1">Trang chủ</span>
</button>
<button class="flex flex-col items-center justify-center bg-secondary-container dark:bg-on-secondary-fixed-variant text-on-secondary-container dark:text-secondary-fixed rounded-full px-6 py-2 border-b-4 border-on-secondary-container translate-y-0.5 border-b-2 transition-all">
<span class="material-symbols-outlined" data-icon="menu_book" style="font-variation-settings: 'FILL' 1;">menu_book</span>
<span class="font-label-caps text-label-caps mt-1">Bài tập</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-2 hover:scale-110 transition-transform">
<span class="material-symbols-outlined" data-icon="workspace_premium">workspace_premium</span>
<span class="font-label-caps text-label-caps mt-1">Quà tặng</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant px-4 py-2 hover:scale-110 transition-transform">
<span class="material-symbols-outlined" data-icon="family_history">family_history</span>
<span class="font-label-caps text-label-caps mt-1">Phụ huynh</span>
</button>
</nav>
</body></html>
