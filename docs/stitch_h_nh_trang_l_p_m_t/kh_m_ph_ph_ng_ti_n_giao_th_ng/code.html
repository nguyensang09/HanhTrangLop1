<path d="M0 50 Q 25 30, 50 50 T 100 50 T 150 50 T 200 50" fill="none" stroke="#53b5df" stroke-width="2"></path>

<script>
        // Simple drag and drop logic for visual interaction (no backend)
        const draggables = document.querySelectorAll('.drag-item');
        const zones = document.querySelectorAll('#zone-road, #zone-water');

        draggables.forEach(draggable => {
            draggable.addEventListener('dragstart', () => {
                draggable.classList.add('opacity-50');
                draggable.setAttribute('data-dragging', 'true');
            });

            draggable.addEventListener('dragend', () => {
                draggable.classList.remove('opacity-50');
                draggable.removeAttribute('data-dragging');
            });
        });

        zones.forEach(zone => {
            zone.addEventListener('dragover', e => {
                e.preventDefault();
                zone.classList.add('scale-105', 'bg-surface-dim');
            });

            zone.addEventListener('dragleave', () => {
                zone.classList.remove('scale-105', 'bg-surface-dim');
            });

            zone.addEventListener('drop', e => {
                e.preventDefault();
                zone.classList.remove('scale-105', 'bg-surface-dim');
                const draggable = document.querySelector('[data-dragging="true"]');
                if(draggable) {
                    // In a real app, we'd check if data-type matches the zone before appending
                    // For UI purposes, we'll just snap it in
                    zone.appendChild(draggable);
                    draggable.classList.remove('scale-105', 'hover:scale-105');
                    draggable.classList.add('scale-75', 'm-1'); // Make smaller when in zone
                    
                    // Simple grid for items in zone
                    zone.classList.remove('justify-center');
                    zone.classList.add('justify-start', 'flex-row', 'flex-wrap', 'content-start');
                    
                    // Hide zone text if items exist
                    const textContent = zone.querySelector('.pointer-events-none');
                    if(textContent) textContent.style.display = 'none';
                }
            });
        });
    </script>
