<style>
        .rain {
            position: absolute;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .drop {
            position: absolute;
            bottom: 100%;
            width: 2px;
            height: 15px;
            pointer-events: none;
            animation: fall linear infinite;
            background: linear-gradient(to bottom, rgba(83, 181, 223, 0), rgba(83, 181, 223, 0.5));
        }

        @keyframes fall {
            to {
                transform: translateY(100vh);
            }
        }

        .draggable {
            cursor: grab;
            touch-action: none;
        }
        .draggable:active {
            cursor: grabbing;
        }

        .droppable-area {
            transition: all 0.3s ease;
        }
        
        .droppable-area.drag-over {
            transform: scale(1.05);
            filter: drop-shadow(0 0 10px rgba(255, 140, 66, 0.5));

<script>
        // Rain effect generation
        const rainContainer = document.getElementById('rainContainer');
        const numDrops = 30; // Light rain
        for (let i = 0; i < numDrops; i++) {
            const drop = document.createElement('div');
            drop.classList.add('drop');
            drop.style.left = `${Math.random() * 100}%`;
            drop.style.animationDuration = `${Math.random() * 1 + 0.5}s`;
            drop.style.animationDelay = `${Math.random() * 2}s`;
            rainContainer.appendChild(drop);
        }

        // Simple Drag and Drop Logic (Mockup)
        const draggables = document.querySelectorAll('.draggable');
        const dropZone = document.getElementById('socNauDropZone');
        
        let draggedItem = null;

        draggables.forEach(draggable => {
            // Desktop Drag Events
            draggable.addEventListener('dragstart', (e) => {
                draggedItem = draggable;
                setTimeout(() => draggable.classList.add('opacity-50'), 0);
            });
            draggable.addEventListener('dragend', () => {
                setTimeout(() => draggable.classList.remove('opacity-50'), 0);
                draggedItem = null;
                dropZone.classList.remove('drag-over');
            });

            // Mobile Touch Events (Basic mockup for visual feedback)
            draggable.addEventListener('touchstart', (e) => {
                draggable.style.transform = 'scale(0.9)';
            }, {passive: true});
            
            draggable.addEventListener('touchend', (e) => {
                draggable.style.transform = 'scale(1)';
                // In a real app, calculate touch end position relative to dropZone
                // Here we just simulate success if it's a correct item
                checkItem(draggable);
            });
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            if (draggedItem) {
                checkItem(draggedItem);
            }
        });

        function checkItem(item) {
            const itemType = item.getAttribute('data-item');
            const validItems = ['raincoat', 'boots', 'umbrella'];
            
            if (validItems.includes(itemType)) {
                // Correct
                item.style.opacity = '0';
                item.style.pointerEvents = 'none';
                
                // Show dressed layer
                const layer = document.getElementById(`dressed-${itemType}`);
                if(layer) layer.style.opacity = '1';
                
                // Add celebration effect (pulse)
                dropZone.classList.add('scale-105');
                setTimeout(() => dropZone.classList.remove('scale-105'), 300);
            } else {
                // Incorrect (shake animation)
                item.animate([
                    { transform: 'translateX(0)' },
                    { transform: 'translateX(-5px)' },
                    { transform: 'translateX(5px)' },
                    { transform: 'translateX(0)' }
                ], { duration: 300, iterations: 2 });
            }
        }
    </script>
