<!-- Navigation suppressed per relevance logic - this is a focused task -->
<script>
        // Simple vanilla JS for the interactive learning logic
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.card-item');
            const nextButton = document.getElementById('next-button');
            const feedbackArea = document.getElementById('feedback-message');
            
            let selectedCards = [];
            let isAnimating = false;

            cards.forEach(card => {
                const mainBtn = card.querySelector('button.card-pressable');
                
                mainBtn.addEventListener('click', () => {
                    if (isAnimating) return;
                    
                    const isSelected = card.classList.contains('selected-state');
                    
                    if (isSelected) {
                        // Deselect
                        card.classList.remove('selected-state');
                        mainBtn.classList.remove('bg-tertiary-fixed', 'border-tertiary', 'selected');
                        mainBtn.classList.add('bg-surface-container-lowest', 'border-tertiary-fixed-dim');
                        selectedCards = selectedCards.filter(c => c !== card);
                        mainBtn.style.setProperty('--border-color', '#53b5df');
                    } else {
                        // Select (limit to 2)
                        if (selectedCards.length < 2) {
                            card.classList.add('selected-state');
                            mainBtn.classList.remove('bg-surface-container-lowest', 'border-tertiary-fixed-dim');
                            mainBtn.classList.add('bg-tertiary-fixed', 'border-tertiary', 'selected');
                            selectedCards.push(card);
                            mainBtn.style.setProperty('--border-color', '#006686');
                        }
                    }

                    // Check Match
                    if (selectedCards.length === 2) {
                        checkMatch();
                    }
                });
            });

            function checkMatch() {
                isAnimating = true;
                const initial1 = selectedCards[0].dataset.initial;
                const initial2 = selectedCards[1].dataset.initial;

                setTimeout(() => {
                    if (initial1 === initial2) {
                        // Success state
                        selectedCards.forEach(card => {
                            const btn = card.querySelector('button.card-pressable');
                            btn.classList.remove('bg-tertiary-fixed', 'border-tertiary');
                            btn.classList.add('bg-secondary-container', 'border-secondary', 'animate-pop-in');
                            btn.style.setProperty('--border-color', '#006c4f');
                        });
                        
                        // Show Feedback
                        feedbackArea.innerHTML = '<span class="font-headline-lg-mobile text-headline-lg-mobile text-secondary flex items-center gap-2 justify-center"><span class="material-symbols-outlined text-[32px]">stars</span> Hoan hô bé!</span>';
                        feedbackArea.classList.remove('opacity-0');
                        
                        // Enable Next Button
                        nextButton.classList.remove('opacity-50', 'cursor-not-allowed', 'translate-y-4');
                        nextButton.classList.add('hover:bg-primary-fixed-dim', 'translate-y-0');
                        
                    } else {
                        // Fail state - shake and reset
                        selectedCards.forEach(card => {
                            const btn = card.querySelector('button.card-pressable');
                            // Simple CSS shake could be added here, just resetting for now
                            btn.classList.remove('bg-tertiary-fixed', 'border-tertiary', 'selected');
                            btn.classList.add('bg-error-container', 'border-error');
                        });
                        
                        setTimeout(() => {
                            selectedCards.forEach(card => {
                                const btn = card.querySelector('button.card-pressable');
                                card.classList.remove('selected-state');
                                btn.classList.remove('bg-error-container', 'border-error');
                                btn.classList.add('bg-surface-container-lowest', 'border-tertiary-fixed-dim');
                                btn.style.setProperty('--border-color', '#53b5df');
                            });
                            selectedCards = [];
                            isAnimating = false;
                        }, 800);
                    }
                }, 300);
            }
        });
    </script>
