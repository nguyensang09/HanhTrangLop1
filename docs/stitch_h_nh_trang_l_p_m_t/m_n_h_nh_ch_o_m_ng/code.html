<style>
        /* Custom styles for claymorphic button press effect */
        .clay-btn {
            position: relative;
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .clay-btn:active {
            transform: translateY(4px);
            border-bottom-width: 0px !important;
            margin-bottom: 4px; /* Compensate for lost border to prevent layout shift */
        }
        
        /* Soft, floating animation for the main character */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        /* Subtle glowing backdrop */
        .soft-glow-bg {
            background: radial-gradient(circle at 50% 50%, rgba(255, 140, 66, 0.15) 0%, rgba(251, 249, 241, 0) 70%);
        }
    </style>
