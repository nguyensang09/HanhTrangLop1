<body class="bg-background text-on-background min-h-screen flex flex-col justify-center items-center px-container-margin overflow-hidden relative">
<!-- Decorative background elements -->

<!-- Main Content Canvas -->
<main class="w-full max-w-md mx-auto flex flex-col items-center">
<!-- Character / Image Container -->

<!-- Animated decorative ring -->

<div class="w-full h-full bg-surface-container rounded-full overflow-hidden shadow-[0_0_20px_rgba(255,140,66,0.15)] flex items-center justify-center relative p-4 z-10 clay-card">
<img alt="Sóc Nâu vươn vai" class="object-contain w-full h-full rounded-full" data-alt="A cheerful, cute cartoon brown squirrel character (Sóc Nâu) doing light stretching exercises, reaching up with a happy expression. The style is soft, tactile claymorphic vector art with warm orange tones, set against a cream background. The mood is encouraging and gentle, suitable for a children's learning app." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDMLIBmrvQms-gK7o1YmONWrdNAzrW28-uwpj6PwKm-2egKppgstn_D0JYREHDQ0RzA6xw6erKj-miBGWBiylKM0lqUMFKjATTcNplY6OArT8yWXZRzdRw1GwyVxTcV1Ysb5ACD12Jkqnr6EqBlSHpcQekqpeIG1hZpM2YSHg1OezjN4uNXM9mnwkkXytEXoIcYFKP-0UMvjFC5dpY_UQe3uwr5T1GyE31Pac-CnGlQWFKY-qgu45c-xQ"/>
</div>
</div>
<!-- Messaging -->
<div class="text-center mb-10 z-10">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-4">
                Bé ơi, mình nghỉ tay một chút cho mắt khỏe nhé!
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-sm mx-auto">
                Cùng Sóc Nâu vươn vai và nhắm mắt lại thư giãn nào.
            </p>
</div>
<!-- Countdown / Action Area -->
<div class="w-full max-w-xs z-10">
<!-- Countdown Circle -->
<div class="flex flex-col items-center justify-center mb-6" id="countdown-container">
<div class="relative w-32 h-32 flex items-center justify-center">
<!-- SVG Circular Progress -->
<svg class="w-full h-full -rotate-90 transform" viewbox="0 0 100 100">
<circle class="text-surface-container-low" cx="50" cy="50" fill="none" r="45" stroke="#f5f4ec" stroke-width="8"></circle>
<circle class="text-secondary transition-all duration-1000 ease-linear stroke-round" cx="50" cy="50" fill="none" id="progress-ring" r="45" stroke="#006c4f" stroke-dasharray="283" stroke-dashoffset="0" stroke-width="8"></circle>
</svg>
<!-- Time Display -->
<div class="absolute flex flex-col items-center">
<span class="font-display-hero text-display-hero text-secondary" id="time-display">30</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">giây</span>
</div>
</div>
</div>
<!-- Action Button (Initially Hidden/Disabled, then shown) -->
<button class="w-full bg-primary-container text-on-primary font-headline-lg-mobile text-headline-lg-mobile py-4 rounded-full flex items-center justify-center gap-2 clay-button opacity-50 cursor-not-allowed touch-target-min mt-4" disabled="" id="resume-btn">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                Quay lại học
            </button>
</div>
</main>
<!-- Top Navigation Structure (Hidden as per intent logic, but structure maintained for consistency if needed later) -->
<!-- Not rendering TopAppBar or BottomNavBar as this is a transactional/temporary pause screen -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            let timeLeft = 30;
            const totalTime = 30;
            const timeDisplay = document.getElementById('time-display');
            const progressRing = document.getElementById('progress-ring');
            const resumeBtn = document.getElementById('resume-btn');
            
            // Circumference for stroke-dashoffset calculation (2 * pi * r) where r = 45
            const circumference = 2 * Math.PI * 45;
            progressRing.style.strokeDasharray = circumference;

            const timer = setInterval(() => {
                timeLeft--;
                timeDisplay.textContent = timeLeft;

                const offset = circumference - (timeLeft / totalTime) * circumference;
                progressRing.style.strokeDashoffset = offset;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    // Hide countdown, enable button
                    document.getElementById('countdown-container').classList.add('opacity-50');
                    progressRing.style.strokeDashoffset = circumference;
                    
                    resumeBtn.disabled = false;
                    resumeBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    resumeBtn.classList.add('hover:bg-primary-fixed-dim');
                    resumeBtn.innerHTML = `
                        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                        Bắt đầu học tiếp!
                    `;
                    
                    // Simple pop animation for button
                    resumeBtn.animate([
                        { transform: 'scale(1)' },
                        { transform: 'scale(1.05)' },
                        { transform: 'scale(1)' }
                    ], {
                        duration: 300,
                        easing: 'ease-out'
                    });
                }
            }, 1000);

            // Optional: Click handler for resume (would typically navigate back)
            resumeBtn.addEventListener('click', () => {
                if(!resumeBtn.disabled) {
                    // Visual feedback
                    resumeBtn.style.transform = 'translateY(2px)';
                    setTimeout(() => {
                        console.log('Resume learning action triggered');
                        // window.history.back(); or similar
                    }, 150);
                }
            });
        });
    </script>
