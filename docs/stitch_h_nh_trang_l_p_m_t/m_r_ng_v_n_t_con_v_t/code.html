<style>
        /* Custom styles for claymorphic effects that go slightly beyond standard tailwind */
        .clay-card {
            box-shadow: 0px 10px 20px rgba(255, 140, 66, 0.05), inset 0px 4px 0px rgba(255, 255, 255, 0.6);
        }
        .clay-button {
            border-bottom-width: 6px;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .clay-button:active {
            border-bottom-width: 0px;
            transform: translateY(6px);
        }
        .radio-card-input:checked + .radio-card-content {
            border-color: #ff8c42; /* primary-container */
            background-color: #ffdbc9; /* primary-fixed */
            transform: scale(0.98);
        }
        .radio-card-input:checked + .radio-card-content .check-icon {
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md text-body-md min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar (from Shared Components JSON - exact strings and execution of style keys) -->
<header class="bg-surface shadow-sm docked full-width top-0 flex justify-between items-center w-full px-container-margin py-unit h-touch-target-min z-40 relative">
<button aria-label="Go back" class="flex items-center justify-center w-touch-target-min h-touch-target-min text-on-surface-variant hover:scale-105 transition-transform active:translate-y-0.5 active:shadow-none duration-150 rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>

<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-extrabold text-primary text-center flex-1">

<div class="flex items-center justify-center h-touch-target-min px-4 bg-surface-container-low rounded-full text-primary font-bold text-label-caps font-label-caps">

<!-- Main Content Canvas -->

<!-- Task Headline -->
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-6 text-center">
            Mở Rộng Vốn Từ
        </h2>
<!-- Sóc Nâu Instruction Dialogue -->

<div class="w-16 h-16 rounded-full overflow-hidden shrink-0 border-4 border-surface shadow-sm z-10 relative">
<img alt="Sóc Nâu" class="w-full h-full object-cover" data-alt="A soft, 3D claymorphic icon of a cute brown squirrel character's head, smiling friendly, on a pastel background. High quality preschool educational art style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBd4w89Jl2e3WV0UEo0oBPSqL_nnwD6lLHeXguhQGJkH5oxz6dPPX249caLWuWYIJArjjF2WJ_YuXywwWLqRHX5M8ToeHGoqI22sl5ZyG4gEcnJTGGzUzCm2O93erE-HwU5k9qqw28Pi95n5zlRntfqnTJJIrRXrE_0L0v7JUmN_oNQOjoc05JyCpUFYFf1bWsZiysT1qdIJ3CGp--TFmWd3fGUg4w_rxFgw88qY_hms-P4PNUOoAFIPA"/>
</div>
<div class="bg-primary-fixed text-on-primary-fixed p-4 rounded-2xl rounded-tl-none shadow-sm flex-1 relative mt-2 clay-card">
<p class="font-title-md text-title-md">
                    Bé hãy nghe tên con vật và chọn hình đúng nhé!
                </p>
</div>
</div>
<!-- Audio Play Button -->
<div class="flex justify-center mb-10">
<button class="clay-button w-24 h-24 rounded-full bg-primary-container text-on-primary-container border-on-primary-container flex flex-col items-center justify-center gap-1 shadow-md group outline-none focus:ring-4 focus:ring-primary-fixed-dim" id="playAudioBtn">
<span class="material-symbols-outlined text-4xl group-active:scale-90 transition-transform" style="font-variation-settings: 'FILL' 1;">volume_up</span>
<span class="font-label-caps text-label-caps uppercase tracking-wider text-[10px]">Nghe</span>
</button>
</div>
<!-- Picture Grid Selection -->
<div class="grid grid-cols-2 gap-card-gap mb-8">
<!-- Card 1 (Elephant - Correct) -->
<label class="relative cursor-pointer group">
<input class="radio-card-input sr-only" name="animal_selection" type="radio" value="elephant"/>
<div class="radio-card-content bg-surface-container-lowest border-4 border-tertiary-fixed-dim rounded-2xl p-2 aspect-square flex flex-col items-center justify-center transition-all duration-200 clay-card hover:border-tertiary">
<img alt="Elephant" class="w-full h-full object-contain rounded-xl" data-alt="A high-quality, preschool-friendly illustration of a cute elephant. The style is soft, claymorphic, and slightly 3D with gentle shadows and warm lighting. Designed for a light-mode educational app, using a pastel palette." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBQqF0aSs3MOx2Z8NtQ8tPp5ipoz8dBl05hTSTrw4b6mURBxw8g0cFsCBE4I7szEspuQINHNJw244HRwmLd4VngBxMpa81F9uJ9YyLHAokmZTpbvhsEpB17GdsceDo60M6we8D4QKAuZlLzWmomtUge6_KttpmCWyzRZ3JjafSffEEMeLXknfEmtucSGGrILKno6ks11IQlFJme8NBENtNcBjbjUFK3Mfc13SzaCWrll9Gfz0Y50ZTGxQ"/>
<!-- Selection Indicator (hidden by default, shown via CSS) -->
<div class="check-icon absolute top-2 right-2 w-8 h-8 bg-primary rounded-full flex items-center justify-center text-on-primary opacity-0 scale-50 transition-all duration-300 shadow-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1; font-size: 20px;">check</span>
</div>
</div>
</label>
<!-- Card 2 (Lion) -->
<label class="relative cursor-pointer group">
<input class="radio-card-input sr-only" name="animal_selection" type="radio" value="lion"/>

<img alt="Lion" class="w-full h-full object-contain rounded-xl" data-alt="A high-quality, preschool-friendly illustration of a cute lion with a fluffy mane. The style is soft, claymorphic, and slightly 3D with gentle shadows and warm lighting. Designed for a light-mode educational app, using a pastel palette." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB5xCDgF9fLhbTBmoJuJ0bhcu7K5C509wh_6kTpK-818JTBw399vusVRkga59af2z84qVn_iOSpZ-yaySV6bYZLY-saNw7pURaxwAOlj6uj1pU0lF2R20_WJ2QbjJx-n14d8JoynMtu0yMhhEzQYHvXz56-YR88GdlcB9xZ8dClhUBinM5KZ8cVPLBHYAe6OqXb8M6Sy7OVNvqnBza1BtpV187rIkrBvHKgyYgOT0ifXcbw3_Q-T-SkIA"/>
<div class="check-icon absolute top-2 right-2 w-8 h-8 bg-primary rounded-full flex items-center justify-center text-on-primary opacity-0 scale-50 transition-all duration-300 shadow-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1; font-size: 20px;">check</span>
</div>
</div>
</label>
<!-- Card 3 (Monkey) -->
<label class="relative cursor-pointer group">
<input class="radio-card-input sr-only" name="animal_selection" type="radio" value="monkey"/>
<div class="radio-card-content bg-surface-container-lowest border-4 border-tertiary-fixed-dim rounded-2xl p-2 aspect-square flex flex-col items-center justify-center transition-all duration-200 clay-card hover:border-tertiary">
<img alt="Monkey" class="w-full h-full object-contain rounded-xl" data-alt="A high-quality, preschool-friendly illustration of a cute playful monkey. The style is soft, claymorphic, and slightly 3D with gentle shadows and warm lighting. Designed for a light-mode educational app, using a pastel palette." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAssWmOB5THZEdsRjp2gFXgiTyqFd1zgMOQR1cVI6KhPHjhShNP0RS1EXt0PC7Mi6yoYRTAm_DsovIFFFfSzWmLGmb7Hym0XVS6FKjYij0pubpVDSPGcnvkPuaOYqFHC2ehJvH-2LAWhm-_7XsQrf-ZWYJXh6-UYXtaFkm_RX5KD7v__SNCIFNn4xeTorjOdk3ANHYDqbpGL8fTcFPy_wG44_dqRAgpcngRC7NYJYBOoDZILnHrvmDeRw"/>
<div class="check-icon absolute top-2 right-2 w-8 h-8 bg-primary rounded-full flex items-center justify-center text-on-primary opacity-0 scale-50 transition-all duration-300 shadow-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1; font-size: 20px;">check</span>
</div>
</div>

<!-- Card 4 (Giraffe) -->
<label class="relative cursor-pointer group">
<input class="radio-card-input sr-only" name="animal_selection" type="radio" value="giraffe"/>
<div class="radio-card-content bg-surface-container-lowest border-4 border-tertiary-fixed-dim rounded-2xl p-2 aspect-square flex flex-col items-center justify-center transition-all duration-200 clay-card hover:border-tertiary">

<div class="check-icon absolute top-2 right-2 w-8 h-8 bg-primary rounded-full flex items-center justify-center text-on-primary opacity-0 scale-50 transition-all duration-300 shadow-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1; font-size: 20px;">check</span>
</div>
</div>
</label>
</div>
<!-- Sticky Bottom Action -->
<div class="mt-auto pt-4">
<button class="clay-button w-full bg-primary text-on-primary border-on-primary-fixed-variant rounded-full py-4 px-8 font-title-md text-title-md flex items-center justify-center gap-2 shadow-lg disabled:opacity-50 disabled:cursor-not-allowed" disabled="" id="checkAnswerBtn">
<span>Kiểm tra</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</div>
</main>
<script>
        // Simple interactions
        document.addEventListener('DOMContentLoaded', () => {
            const playBtn = document.getElementById('playAudioBtn');
            const checkBtn = document.getElementById('checkAnswerBtn');
            const radioInputs = document.querySelectorAll('.radio-card-input');

            // Simulate Audio Play
            playBtn.addEventListener('click', () => {
                // Add a visual pulse effect
                playBtn.classList.add('ring-4', 'ring-primary-fixed-dim');
                const icon = playBtn.querySelector('.material-symbols-outlined');
                icon.style.transform = 'scale(1.2)';
                
                setTimeout(() => {
                    playBtn.classList.remove('ring-4', 'ring-primary-fixed-dim');
                    icon.style.transform = 'scale(1)';
                }, 300);
            });

            // Enable check button when an option is selected
            radioInputs.forEach(input => {
                input.addEventListener('change', () => {
                    if (document.querySelector('input[name="animal_selection"]:checked')) {
                        checkBtn.removeAttribute('disabled');
                        // Add a slight bounce to the check button to draw attention
                        checkBtn.classList.add('animate-bounce');
                        setTimeout(() => checkBtn.classList.remove('animate-bounce'), 1000);
                    }
                });
            });
        });
    </script>
