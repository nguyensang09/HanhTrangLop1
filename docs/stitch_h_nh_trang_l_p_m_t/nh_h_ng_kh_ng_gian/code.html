<!-- Interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const bird = document.getElementById('bird-draggable');
            const cage = document.getElementById('cage-dropzone');
            const targetIndicator = document.getElementById('cage-target-indicator');
            const interactiveArea = document.getElementById('interactive-area');
            const successOverlay = document.getElementById('success-overlay');
            const successContent = document.querySelector('.success-content');

            let isDragging = false;
            let startX, startY;
            let currentX = 0;
            let currentY = 0;
            let initialX = 0;
            let initialY = 0;

            // Audio context (mock)
            function playSound(type) {
                // In a real app, this would play actual audio files
                console.log(`Playing sound: ${type}`);
                if(type === 'success') {
                    // Confetti logic could also go here
                }
            }

            window.playInstructionSound = () => {
                playSound('instruction');
                // Visual feedback on the character could be added here
            };

            window.completeLevel = () => {
                // Navigate to next screen or close
                console.log("Level Complete clicked");
                // Temporary reset for demo purposes
                successOverlay.classList.add('hidden');
                successContent.classList.remove('success-anim', 'flex');
                successContent.classList.add('hidden');
                bird.style.transform = `translate(0px, 0px)`;
                bird.style.left = '';
                bird.style.bottom = '';
                bird.style.top = '';
                currentX = 0; currentY = 0;
            };

            // Touch/Mouse Events
            function dragStart(e) {
                if (e.type === "touchstart") {
                    initialX = e.touches[0].clientX - currentX;
                    initialY = e.touches[0].clientY - currentY;
                } else {
                    initialX = e.clientX - currentX;
                    initialY = e.clientY - currentY;
                }
                
                if (e.target === bird || bird.contains(e.target)) {
                    isDragging = true;
                    bird.classList.add('dragging');
                    playSound('grab');
                }
            }

            function dragEnd(e) {
                if (!isDragging) return;
                
                initialX = currentX;
                initialY = currentY;
                isDragging = false;
                bird.classList.remove('dragging');
                cage.classList.remove('drag-over');
                targetIndicator.style.borderColor = 'transparent';

                // Check collision/drop
                const birdRect = bird.getBoundingClientRect();
                const cageRect = cage.getBoundingClientRect();

                // Simple AABB collision detection
                const isInside = (
                    birdRect.left > cageRect.left &&
                    birdRect.right < cageRect.right &&
                    birdRect.top > cageRect.top &&
                    birdRect.bottom < cageRect.bottom
                );

                if (isInside) {
                    // Success!
                    playSound('success');
                    // Snap to center of cage
                    const cageCenterX = cageRect.left + cageRect.width / 2;
                    const cageCenterY = cageRect.top + cageRect.height / 2;
                    const birdCenterX = birdRect.left + birdRect.width / 2;
                    const birdCenterY = birdRect.top + birdRect.height / 2;
                    
                    const snapX = currentX + (cageCenterX - birdCenterX);
                    const snapY = currentY + (cageCenterY - birdCenterY);
                    
                    bird.style.transform = `translate(${snapX}px, ${snapY}px)`;
                    
                    // Show success modal after short delay
                    setTimeout(() => {
                        successOverlay.classList.remove('hidden');
                        successOverlay.classList.add('flex');
                        successContent.classList.remove('hidden');
                        successContent.classList.add('flex', 'success-anim');
                    }, 500);

                } else {
                    // Snap back logic if missed
                    // bird.style.transform = `translate(0px, 0px)`;
                    // currentX = 0; currentY = 0;
                }
            }

            function drag(e) {
                if (isDragging) {
                    e.preventDefault(); // Prevent scrolling
                
                    if (e.type === "touchmove") {
                        currentX = e.touches[0].clientX - initialX;
                        currentY = e.touches[0].clientY - initialY;
                    } else {
                        currentX = e.clientX - initialX;
                        currentY = e.clientY - initialY;
                    }

                    bird.style.transform = `translate(${currentX}px, ${currentY}px)`;

                    // Visual feedback when hovering over target
                    const birdRect = bird.getBoundingClientRect();
                    const cageRect = cage.getBoundingClientRect();
                    
                    // Relaxed collision for hover state
                    if (
                        birdRect.left < cageRect.right &&
                        birdRect.right > cageRect.left &&
                        birdRect.top < cageRect.bottom &&
                        birdRect.bottom > cageRect.top
                    ) {
                        cage.classList.add('drag-over');
                        targetIndicator.style.borderColor = 'var(--tw-colors-tertiary-container)';
                    } else {
                        cage.classList.remove('drag-over');
                        targetIndicator.style.borderColor = 'transparent';
                    }
                }
            }

            // Event Listeners
            interactiveArea.addEventListener("touchstart", dragStart, { passive: false });
            interactiveArea.addEventListener("touchend", dragEnd, { passive: false });
            interactiveArea.addEventListener("touchmove", drag, { passive: false });

            interactiveArea.addEventListener("mousedown", dragStart);
            interactiveArea.addEventListener("mouseup", dragEnd);
            interactiveArea.addEventListener("mousemove", drag);
            
            // Prevent default drag behavior on images
            bird.ondragstart = function() { return false; };
        });
    </script>
