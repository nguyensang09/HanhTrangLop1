<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col pb-24 md:pb-0">
<!-- TopAppBar -->

<div class="flex-grow z-10">

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</button>
</section>
<!-- Interactive Grid -->
<section class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 w-full max-w-3xl mx-auto flex-grow items-center">
<!-- Item 1: Đồng hồ (Tròn - Đúng) -->
<button class="item-card bg-white border-2 border-surface-container-high rounded-2xl p-4 flex flex-col items-center justify-center gap-3 aspect-square relative cursor-pointer" onclick="this.classList.toggle('selected')">
<div class="w-24 h-24 md:w-32 md:h-32 rounded-full bg-surface-container flex items-center justify-center overflow-hidden">
<img alt="Đồng hồ" class="w-full h-full object-contain p-2" data-alt="A highly detailed, colorful, claymorphic 3D illustration of a simple round wall clock. The clock has a soft, tactile appearance with thick hands, bright colors suited for a preschooler UI, light mode aesthetic, white background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBP9gsqwDuwY2030jokklNeemI5iD-RZ9YTBhZrtfWxSN5DKglg6vitkzn97ePJKjfLmabC76MVcVn2BHfkK_71rj3QtlAPvm6a463qbR-ZuST9wwG65z7OCDeFKqOskUydcu2QbfWe3sEaWjO7WpoNLTe-zphsKIplMKSSdE-XyQzrHLnHzqfAt_NSb2j9eXkhTEQADF3fWQQOz7d_srokdEtCjjaURKcc0evkJsjPIdtJAYR0ixz0_Q"/>

<div class="absolute top-3 right-3 w-8 h-8 rounded-full border-2 border-surface-container-high bg-white flex items-center justify-center indicator">

<!-- Item 2: Hộp quà (Vuông - Sai) -->

</div>
<div class="absolute top-3 right-3 w-8 h-8 rounded-full border-2 border-surface-container-high bg-white flex items-center justify-center indicator">

<!-- Item 3: Biển báo (Tam giác - Sai) -->

<img alt="Biển báo" class="w-full h-full object-contain p-2" data-alt="A highly detailed, colorful, claymorphic 3D illustration of a triangular traffic yield sign. Soft, tactile appearance, bright colors suited for a preschooler UI, light mode aesthetic, white background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBcOiBUZ2yLYBCBurt_f6IcmiPTZqhVt0-LhhO3ubGP-jmzhcp2XscfAlStNLfRA9A0xo4si1qw04jX7CfRbzBvQjH7jbHiQaPFqaD1YphFL1ORNH95ucqYZZ4I4JMmfwFCiceWTTAF2qnr4D_rIKT68UQ2KykdGrppbz_2KykjSXIDpMCJw7aWDwYBt3mKv3yVHjlaOmKxmM1eYcfM-x2uDNgAikPrssTlrpWQXfwR9hbSAJRPodV7Bg"/>
</div>
<div class="absolute top-3 right-3 w-8 h-8 rounded-full border-2 border-surface-container-high bg-white flex items-center justify-center indicator">
<span class="material-symbols-outlined text-transparent check-icon">check</span>
</div>

<!-- Item 4: Quả bóng (Tròn - Đúng) -->

</div>
<div class="absolute top-3 right-3 w-8 h-8 rounded-full border-2 border-surface-container-high bg-white flex items-center justify-center indicator">
<span class="material-symbols-outlined text-transparent check-icon">check</span>
</div>
</button>
</section>
<!-- Primary Action -->
<div class="mt-8 flex justify-center w-full max-w-md mx-auto">
<button class="w-full h-16 bg-[#D2B48C] text-white font-headline-lg-mobile text-headline-lg-mobile rounded-full pressable-btn border-[#A0825A] flex items-center justify-center gap-2 shadow-sm">
<span>Kiểm tra</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">task_alt</span>
</button>
</div>
</main>
<!-- BottomNavBar (Hidden on desktop, shown on mobile if it's a top-level destination, but this is a task-focused screen so it should ideally be suppressed based on rules. However, the user provided BottomNavBar JSON, so we include it but it usually goes against the "Task-Focused suppression rule" if "Kiểm tra" is the main action. We'll render it to fulfill the JSON request, but semantic rules suggest it shouldn't be here. Let's include it for compliance with JSON structure, but in a real app, it might be hidden). -->
<!-- Assuming this is a learning module screen, we hide the BottomNavBar as per the instruction: "Automatic Suppression: You MUST exclude the navigation shell if the page intent is: Task-Focused: Any sub-page featuring a 'Close' or 'Back' action..." The top bar has a back button, thus we suppress BottomNavBar. -->
<script>
        // Simple logic to style the checkmarks when selected
        document.querySelectorAll('.item-card').forEach(card => {
            card.addEventListener('click', () => {
                const icon = card.querySelector('.check-icon');
                const indicator = card.querySelector('.indicator');
                
                if (card.classList.contains('selected')) {
                    icon.classList.remove('text-transparent');
                    icon.classList.add('text-tertiary');
                    indicator.classList.remove('border-surface-container-high');
                    indicator.classList.add('border-tertiary');
                    indicator.classList.add('bg-tertiary-fixed-dim');
                } else {
                    icon.classList.add('text-transparent');
                    icon.classList.remove('text-tertiary');
                    indicator.classList.add('border-surface-container-high');
                    indicator.classList.remove('border-tertiary');
                    indicator.classList.remove('bg-tertiary-fixed-dim');
                }
            });
        });
    </script>
