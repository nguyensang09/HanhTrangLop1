<style>
        .clay-button {
            border-bottom: 4px solid #6a2d00; /* Darker primary shade */
            transition: all 0.15s ease;
        }
        .clay-button:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
            margin-bottom: 2px;
        }
        .clay-card {
            box-shadow: 0 10px 20px -5px rgba(255, 140, 66, 0.15); /* Soft primary tint shadow */
        }
    </style>

<body class="bg-background min-h-screen flex flex-col font-body-md text-on-surface">
<!-- Main Content Area: Centered Login Form -->
<main class="flex-grow flex items-center justify-center p-container-margin md:p-12 relative overflow-hidden">
<!-- Decorative Background Element -->
<div class="absolute top-[-10%] right-[-10%] w-64 h-64 bg-primary-container rounded-full blur-[80px] opacity-20 pointer-events-none"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-80 h-80 bg-secondary-container rounded-full blur-[80px] opacity-20 pointer-events-none"></div>
<div class="w-full max-w-md bg-surface-container-lowest rounded-[24px] p-8 md:p-10 clay-card relative z-10 border border-outline-variant/30">
<!-- Branding -->
<div class="text-center mb-8">
<div class="w-20 h-20 mx-auto mb-4 bg-surface-container rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-[40px] text-primary" style="font-variation-settings: 'FILL' 1;">
                        cruelty_free
                    </span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-2">Chào mừng trở lại!</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Đăng nhập để đồng hành cùng bé</p>
</div>
<!-- Login Form -->
<form class="space-y-6">
<div class="space-y-1">
<label class="font-body-lg text-[16px] text-on-surface" for="email">Email hoặc Số điện thoại</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-4 text-on-surface-variant pointer-events-none">
<span class="material-symbols-outlined">person</span>
</span>
<input class="w-full h-touch-target-min pl-12 pr-4 rounded-xl border border-outline bg-surface focus:ring-2 focus:ring-primary focus:border-primary transition-colors text-on-surface placeholder-on-surface-variant/50" id="email" name="email" placeholder="Nhập email hoặc SĐT của bạn" type="text"/>
</div>
</div>
<div class="space-y-1">
<div class="flex justify-between items-center">
<label class="font-body-lg text-[16px] text-on-surface" for="password">Mật khẩu</label>
<a class="font-body-md text-[14px] text-primary font-medium hover:underline" href="#">Quên mật khẩu?</a>
</div>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-4 text-on-surface-variant pointer-events-none">
<span class="material-symbols-outlined">lock</span>
</span>
<input class="w-full h-touch-target-min pl-12 pr-12 rounded-xl border border-outline bg-surface focus:ring-2 focus:ring-primary focus:border-primary transition-colors text-on-surface placeholder-on-surface-variant/50" id="password" name="password" placeholder="Nhập mật khẩu" type="password"/>
<button class="absolute inset-y-0 right-0 flex items-center pr-4 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<button class="w-full h-14 bg-primary text-on-primary font-headline-lg-mobile text-[18px] rounded-full clay-button flex items-center justify-center gap-2" type="submit">
                    Đăng nhập
                    <span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">login</span>
</button>
</form>
<div class="mt-8 mb-6 relative">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center">
<span class="px-4 bg-surface-container-lowest font-body-md text-[14px] text-on-surface-variant">Hoặc đăng nhập với</span>
</div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="h-touch-target-min flex items-center justify-center gap-2 border border-outline-variant bg-surface rounded-xl hover:bg-surface-container-low transition-colors font-body-md text-[16px] text-on-surface" type="button">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Google
                </button>
<button class="h-touch-target-min flex items-center justify-center gap-2 border border-outline-variant bg-surface rounded-xl hover:bg-surface-container-low transition-colors font-body-md text-[16px] text-on-surface" type="button">
<svg class="w-5 h-5" fill="#1877F2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path>
</svg>
                    Facebook
                </button>
</div>
<!-- Sign Up Link -->
<div class="mt-8 text-center">
<p class="font-body-md text-[16px] text-on-surface-variant">
                    Chưa có tài khoản? 
                    <a class="text-primary font-headline-lg-mobile text-[16px] hover:underline ml-1" href="#">Tạo tài khoản mới</a>
</p>
</div>
</div>
</main>
