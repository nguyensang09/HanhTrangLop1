<style>
        .clay-button {
            border-bottom: 4px solid var(--tw-colors-primary); /* Adjusted dynamically below via classes */
            transition: all 0.15s ease-in-out;
        }
        .clay-button:active {
            transform: translateY(4px);
            border-bottom-width: 0px;
            margin-bottom: 4px; /* Maintain height */
        }
        .floating-card {
            box-shadow: 0px 10px 20px -5px rgba(255, 140, 66, 0.1);
        }
        
        .letter-btn {
            border-bottom: 6px solid #dcdad2;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .letter-btn:active {
            transform: translateY(4px) scale(0.98);
            border-bottom-width: 2px;
        }
        .letter-btn.selected-correct {
            border-bottom: 6px solid #00513b;
            background-color: #51fac1;
            color: #002116;
            animation: bounce-success 0.5s ease;
        }
        .letter-btn.selected-incorrect {
            border-bottom: 6px solid #93000a;
            background-color: #ffdad6;
            color: #331200;
            animation: shake-error 0.4s ease;
        }

        @keyframes bounce-success {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        @keyframes shake-error {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-2deg); }
            75% { transform: translateX(5px) rotate(2deg); }
        }

<script>
        function selectAnswer(btn, isCorrect) {
            // Reset all buttons
            document.querySelectorAll('.letter-btn').forEach(b => {
                b.classList.remove('selected-correct', 'selected-incorrect');
            });

            if (isCorrect) {
                btn.classList.add('selected-correct');
                
                // Show success overlay after brief delay for animation to play
                setTimeout(() => {
                    const overlay = document.getElementById('success-feedback');
                    const card = document.getElementById('success-card');
                    overlay.classList.remove('hidden');
                    overlay.classList.add('flex');
                    
                    // Simple animation
                    setTimeout(() => {
                        card.classList.remove('scale-90', 'opacity-0');
                        card.classList.add('scale-100', 'opacity-100');
                    }, 50);
                }, 600);
            } else {
                btn.classList.add('selected-incorrect');
                // Remove incorrect class after animation so user can try again
                setTimeout(() => {
                    btn.classList.remove('selected-incorrect');
                }, 800);
            }
        }

        function nextLesson() {
            // In a real app, navigate to next screen. Here, just reset for demo.
            const overlay = document.getElementById('success-feedback');
            const card = document.getElementById('success-card');
            
            card.classList.remove('scale-100', 'opacity-100');
            card.classList.add('scale-90', 'opacity-0');
            
            setTimeout(() => {
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
                document.querySelectorAll('.letter-btn').forEach(b => {
                    b.classList.remove('selected-correct', 'selected-incorrect');
                });
            }, 300);
        }
    </script>
