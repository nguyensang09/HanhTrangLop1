<script>
        // Very basic drag and drop simulation for demonstration
        const draggables = document.querySelectorAll('.draggable');
        const dropzones = document.querySelectorAll('.dropzone');
        
        let counts = {
            square: 0,
            circle: 0
        };

        draggables.forEach(draggable => {
            // Simulated interaction: clicking an item moves it to the correct box
            draggable.addEventListener('click', () => {
                const type = draggable.dataset.type;
                const targetZone = document.querySelector(`.dropzone[data-type="${type}"]`);
                
                if (targetZone && !draggable.classList.contains('placed')) {
                    draggable.style.transition = 'all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
                    
                    // visual feedback on zone
                    targetZone.classList.add('active-zone');
                    setTimeout(() => targetZone.classList.remove('active-zone'), 300);

                    // move and scale
                    draggable.style.transform = 'scale(0.5)';
                    draggable.style.opacity = '0';
                    draggable.classList.add('placed');
                    
                    // update count
                    counts[type]++;
                    document.getElementById(`count-${type}`).textContent = `Đã có: ${counts[type]}/2`;
                    
                    // Simple success check
                    if(counts.square === 2 && counts.circle === 2) {
                        setTimeout(() => {
                            alert('Chúc mừng bé đã hoàn thành!');
                        }, 500);
                    }
                }
            });
        });
    </script>
