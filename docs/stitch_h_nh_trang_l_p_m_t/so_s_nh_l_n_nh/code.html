<style>
        .pressable {
            border-bottom-width: 4px;
            border-color: rgba(0,0,0,0.1);
            transition: all 0.1s;
        }
        .pressable:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }
        .card-shadow {
            box-shadow: 0 4px 20px rgba(255, 140, 66, 0.05);
        }
        .option-card.selected {
            border-color: #53b5df;
            background-color: #f5f4ec;
            transform: scale(1.02);
            box-shadow: 0 0 0 4px rgba(83, 181, 223, 0.2);
        }
    </style>

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col md:hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-container-margin py-unit w-full sticky top-0 z-50 bg-surface w-full rounded-b-xl border-b-4 border-surface-container-highest shadow-sm">
<button aria-label="Quay lại" class="flex items-center justify-center min-w-[48px] min-h-[48px] text-primary hover:scale-105 transition-transform active:translate-y-0.5">
<span class="material-symbols-outlined" style="font-size: 28px;">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary truncate flex-1 text-center font-bold">So Sánh Lớn - Nhỏ</h1>
<div class="min-w-[48px] min-h-[48px] flex items-center justify-end text-on-surface-variant font-label-caps text-label-caps font-bold">
            125 ⭐
        </div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-container-margin py-6 gap-card-gap overflow-y-auto pb-24">
<!-- Sóc Nâu Dialogue (Instruction) -->
<section aria-label="Hướng dẫn" class="bg-[#FFF4D2] border-2 border-[#FFE082] rounded-xl p-4 flex items-center gap-4 card-shadow pressable" role="region">
<div class="w-16 h-16 rounded-full bg-surface-container-highest flex-shrink-0 flex items-center justify-center overflow-hidden border-2 border-primary-container">
<img class="w-full h-full object-cover" data-alt="A cute, highly detailed 2D illustration of a friendly brown squirrel (Sóc Nâu) mascot with large expressive eyes and a warm smile, wearing a tiny scout scarf. The style is soft, claymorphic, and suitable for preschool children's educational apps. Bright, warm lighting, isolated on a clean cream background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBDSsHLggkBRLjtm8o223KiGYdjLIkGK3Wus_lSta-ZwgNeFrCFycP1S8pGQt75zNt9WTBCy-2jSYRzuFqrFDONWbfaJKdnzwME7I-yk6L8dp7EpMJpnjAnLhY_B9BgjBohTA9XuUnvUMMEKH2STq9GMyzxOhGSadX8TlAtL0xczttTNn01h7n4yaIrfxRp6DyLOK00K0nd2_8vJ4XPeBceShwAc0vbHXgP_7nTNXixV1D9uZUSiYHTWg"/>
</div>
<div class="flex-1">
<p class="font-title-md text-title-md text-on-surface">Bé hãy chọn chú thỏ lớn hơn nhé!</p>
</div>
<button aria-label="Nghe lại hướng dẫn" class="min-w-[48px] min-h-[48px] rounded-full bg-primary-container text-on-primary flex items-center justify-center hover:scale-105 transition-transform shadow-md">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</button>
</section>
<!-- Interactive Comparison Area -->
<section class="flex-1 flex flex-col justify-center items-center gap-6 mt-4">
<div class="w-full grid grid-cols-2 gap-4">
<!-- Option 1: Large Rabbit -->
<button aria-label="Chọn chú thỏ to" class="option-card flex flex-col items-center justify-center p-4 rounded-xl border-2 border-surface-variant bg-surface card-shadow pressable relative group outline-none focus:ring-4 focus:ring-primary-container" id="option-large">
<div class="w-full aspect-square rounded-lg bg-surface-container-lowest overflow-hidden flex items-center justify-center p-2">
<img class="w-full h-full object-contain" data-alt="A soft, colorful, and highly detailed 2D illustration of a very large, fluffy white rabbit sitting happily. The style is gentle and claymorphic, designed for a preschool learning interface. Soft ambient shadows and pastel colors, set against a pristine white background. The image should convey size and scale clearly." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD9ytrRlROx4v8eAjwQnxZ7euQo_AsUdbvnEwXqDGGqsqdCebB3LTDiJKY4PbSR0n8gONWlEOYOwme3hjAOR2i-9w5fAUgIvs0ezO69cmxhvG5tJDg2FhC5oZ8Wi6RyrV4X7VmaPNllyrHXC3d072tckjoW4xI3XPyBAfTSB2Z7tJSMJxBl5rhXU5UZcWPTD3xuKsfD1NutS7zvQ5XocoQjQX5jkapwllxI32mSKk482wfS4-ntEn3a6g"/>
</div>
<!-- Selection indicator hidden by default -->
<div class="absolute top-2 right-2 w-8 h-8 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center opacity-0 group-[.selected]:opacity-100 transition-opacity">
<span class="material-symbols-outlined font-bold" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</button>
<!-- Option 2: Small Rabbit -->
<button aria-label="Chọn chú thỏ nhỏ" class="option-card flex flex-col items-center justify-center p-4 rounded-xl border-2 border-surface-variant bg-surface card-shadow pressable relative group outline-none focus:ring-4 focus:ring-primary-container" id="option-small">
<div class="w-full aspect-square rounded-lg bg-surface-container-lowest overflow-hidden flex items-center justify-center p-6">
<img class="w-full h-full object-contain scale-50" data-alt="A soft, colorful, and highly detailed 2D illustration of a very small, cute white baby rabbit sitting timidly. The style is gentle and claymorphic, designed for a preschool learning interface. Soft ambient shadows and pastel colors, set against a pristine white background. The image should convey a small size in contrast to the larger rabbit." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDdXJfdsca4Mvq6xWPbhNDNj1qVjOwR9K4SF83GLmwkNMV-LTsAHUCi4W4yMcgeIXOCmtbE-L_BtEYiA_H_nv_33g7aOxPo91MiO2Iqlk_jcNRfv-RuAl6dsv1MA7WOkc6G7HQL2YrOu-tbGsry3OaDJFpwT0Wwl4YnW22dpBr0UXRl2op6TsEVteH75P0IZGHMCKqQw1Q6sKy6hMkJiRQlc9t-H_mW-l4lgBHNf9fyarM7am6D3X4NMA"/>
</div>
<!-- Selection indicator hidden by default -->
<div class="absolute top-2 right-2 w-8 h-8 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center opacity-0 group-[.selected]:opacity-100 transition-opacity">
<span class="material-symbols-outlined font-bold" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</button>
</div>
</section>
<!-- Bottom Action Area -->
<div class="mt-auto pt-6 flex justify-center w-full">
<button class="w-full max-w-sm py-4 px-8 rounded-full bg-surface-variant text-on-surface-variant font-label-caps text-label-caps font-bold text-center opacity-50 cursor-not-allowed transition-all duration-300 pressable" disabled="" id="btn-continue">
                Tiếp tục
            </button>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const options = document.querySelectorAll('.option-card');
            const btnContinue = document.getElementById('btn-continue');
            const largeOption = document.getElementById('option-large');

            options.forEach(option => {
                option.addEventListener('click', () => {
                    // Remove selected from all
                    options.forEach(opt => opt.classList.remove('selected'));
                    
                    // Add selected to clicked
                    option.classList.add('selected');

                    // Check if correct (assuming large is correct based on prompt)
                    if (option.id === 'option-large') {
                        // Correct choice
                        btnContinue.classList.remove('bg-surface-variant', 'text-on-surface-variant', 'opacity-50', 'cursor-not-allowed');
                        btnContinue.classList.add('bg-primary-container', 'text-on-primary', 'shadow-md');
                        btnContinue.removeAttribute('disabled');
                        
                        // Play success sound/animation logic here
                    } else {
                        // Incorrect choice
                        btnContinue.classList.add('bg-surface-variant', 'text-on-surface-variant', 'opacity-50', 'cursor-not-allowed');
                        btnContinue.classList.remove('bg-primary-container', 'text-on-primary', 'shadow-md');
                        btnContinue.setAttribute('disabled', 'true');
                        
                        // Slight shake animation for incorrect
                        option.animate([
                            { transform: 'translateX(0px)' },
                            { transform: 'translateX(-5px)' },
                            { transform: 'translateX(5px)' },
                            { transform: 'translateX(-5px)' },
                            { transform: 'translateX(5px)' },
                            { transform: 'translateX(0px)' }
                        ], {
                            duration: 400,
                            easing: 'ease-in-out'
                        });
                        
                        setTimeout(() => {
                             option.classList.remove('selected');
                        }, 500);
                    }
                });
            });
        });
    </script>
</body></html>
