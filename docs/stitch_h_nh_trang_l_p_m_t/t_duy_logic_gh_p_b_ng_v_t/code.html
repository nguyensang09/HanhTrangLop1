        }

<div class="flex items-center gap-2 bg-surface-container rounded-full px-4 py-2">
<span class="material-symbols-outlined text-tertiary" data-icon="star" data-weight="fill" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="font-title-md text-title-md text-on-surface">125</span>
</div>

<div>

</div>
</div>
