            transition: all 0.1s ease;
        }
        .clay-button:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }
        .animal-option:active {
            transform: scale(0.95);

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col pb-24">
<!-- TopAppBar -->
<header class="docked full-width top-0 bg-surface dark:bg-surface-dim flex justify-between items-center w-full px-container-margin py-unit h-touch-target-min z-40 sticky">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full overflow-hidden bg-primary-container flex items-center justify-center">

<h1 class="font-title-md text-title-md text-primary dark:text-primary-fixed">Hành Trang Lớp Một</h1>

</div>
<div class="flex-grow">
<div class="flex items-center justify-between mb-2">
<h2 class="font-title-md text-title-md text-primary">Bé hãy tìm hình khác biệt nhé!</h2>
<button class="w-12 h-12 rounded-full bg-primary-container text-on-primary flex items-center justify-center clay-button hover:bg-primary-fixed hover:text-on-primary-fixed transition-colors">
<span class="material-symbols-outlined" data-icon="volume_up" data-weight="fill" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</button>
</div>
<p class="font-body-md text-on-surface-variant">Trong 4 bạn dưới đây, có 1 bạn không giống các bạn còn lại. Bé hãy chạm vào bạn ấy nha!</p>
</div>
</div>
<!-- Progress Bar -->
<div class="w-full h-4 bg-surface-container-high rounded-full overflow-hidden mb-4">
<div class="h-full bg-secondary-container w-1/3 rounded-full flex justify-end">
<div class="w-4 h-4 bg-secondary rounded-full"></div>
</div>
</div>
<!-- Game Area (Bento Grid) -->
<div class="grid grid-cols-2 gap-4 md:gap-6 mt-4">
<!-- Option 1 (Chicken) -->
<button class="animal-option aspect-square bg-white rounded-2xl border-4 border-surface-container hover:border-tertiary-container transition-all flex items-center justify-center p-4 clay-card relative overflow-hidden group">
<img class="w-3/4 h-3/4 object-contain group-hover:scale-110 transition-transform duration-300" data-alt="A cute, simple illustration of a yellow chick facing forward. Preschool educational style. Flat vector art, bright vibrant colors, thick soft outlines, soft drop shadow on a white background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDGiBug0uoPdvwRXuRot3cA7E6PnIH7B5sHte-8-2tl9WEBA-npIuDaPbg1HvlRf8QQPbdSJZP7b6pOCR5miKGI4sHKZvmGiOn2cMwwkcCxRD0xIV_hrzPd9TbRfZ4vk6tmzcDADfrkq0kTztj7lyNWzMRzR0GEUQHTkGMohxLtLLzJXkURzZnkTzSJpCjwFk4IUrt1W9tzHjodvK-HURj0z9YDIuUH5SiQInqGN_vUrHk5aXjb9K4lVw"/>
<div class="absolute inset-0 bg-tertiary-container opacity-0 group-hover:opacity-10 transition-opacity"></div>
</button>
<!-- Option 2 (Chicken) -->
<button class="animal-option aspect-square bg-white rounded-2xl border-4 border-surface-container hover:border-tertiary-container transition-all flex items-center justify-center p-4 clay-card relative overflow-hidden group">
<img class="w-3/4 h-3/4 object-contain group-hover:scale-110 transition-transform duration-300" data-alt="A cute, simple illustration of a yellow chick facing forward. Preschool educational style. Flat vector art, bright vibrant colors, thick soft outlines, soft drop shadow on a white background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAGZ8SY7WBZNvxzs-jEvPrpZFb0wi7FnrH9vKUpLTtrfhnYUfXQX-vY9hRhjkgSMcLgBqhKV15LZVjbdERTRw4M7kGpLrdUZjSXetEWHDo4ZJqMA3mQ09IUS1CdY2BM2hKXZnDav8K7GGZqxh4rErDXjElMKPJ7wh_1bGAxnzGPCj9-dfU_XiDGfPv4vYfQmS7V5TfAJ2xTajrMDKn9Z14BICGWuYSZzH4UDrkcnqRANFZlJHy-39lZoQ"/>
<div class="absolute inset-0 bg-tertiary-container opacity-0 group-hover:opacity-10 transition-opacity"></div>
</button>
<!-- Option 3 (Duck - The odd one out) -->

<img class="w-3/4 h-3/4 object-contain group-hover:scale-110 transition-transform duration-300" data-alt="A cute, simple illustration of a white duckling facing forward. Preschool educational style. Flat vector art, bright vibrant colors, thick soft outlines, soft drop shadow on a white background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB4iwGFEQRG4XuMb5-nTuJfe8E8ugqVcdbVUbrtwnSj6v69QQ75ZVEVtnvSxCyTUIE0RnKPNN-qo-x4s7qqkfTyupG9L9InVdd8qSnIn2OKrejftO4_vdx1GCcVq1_tyt8Hjn8L6hfUl1QnE4-ImRt_Gzt-_SYBaWhdsZfRcim2JtrO5DzmgR-cXBJOafxWi63wsEM5chchT-tQVXfEdYMGqlfh7hTJYu8y-3KcTcjX-gvKzZAzN3k8RQ"/>
<div class="absolute inset-0 bg-tertiary-container opacity-0 group-hover:opacity-10 transition-opacity"></div>
<!-- Success State Overlay (Hidden by default) -->
<div class="success-overlay absolute inset-0 bg-secondary-container/20 flex items-center justify-center opacity-0 transition-opacity duration-300">
<span class="material-symbols-outlined text-6xl text-secondary" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Option 4 (Chicken) -->
<button class="animal-option aspect-square bg-white rounded-2xl border-4 border-surface-container hover:border-tertiary-container transition-all flex items-center justify-center p-4 clay-card relative overflow-hidden group">
<img class="w-3/4 h-3/4 object-contain group-hover:scale-110 transition-transform duration-300" data-alt="A cute, simple illustration of a yellow chick facing forward. Preschool educational style. Flat vector art, bright vibrant colors, thick soft outlines, soft drop shadow on a white background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDgncWxVXaKtP_3HNvAEcd0EvMQXRkA6j6_BiCSGwum4Tx9A6m9qrXIrprzqoIPyv1ULvTq1vCCVZT09dS0UUhKpAzcU55mdRotzD9WJt_D7yyjlpdX5A79Pk14R8HwO5Uaw2ou-9vwqjoZKJbgmbLgkkZtKinI2aRFR2b7ZNFCTRTP62g_11NEeSBF6eWDW_OvzyblrU9AXhoIWGo9HeN_lwnD2wnp961qICXxTLsNASkwm-0ZTr4hnw"/>

<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-gutter pb-4 pt-2 bg-surface-container dark:bg-surface-container-highest docked full-width bottom-0 rounded-t-xl shadow-sm border-t-0">
<!-- Inactive Tab -->
<a class="flex flex-col items-center justify-center text-outline dark:text-outline-variant px-4 py-2 hover:bg-primary-fixed dark:hover:bg-on-primary-fixed-variant rounded-xl transition-colors" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-label-caps text-[12px]">Trang chủ</span>
</a>
<!-- Active Tab (Bài tập) -->
<a class="flex flex-col items-center justify-center bg-primary-container dark:bg-on-primary-container text-on-primary-container dark:text-primary-fixed-dim rounded-xl px-4 py-2 translate-y-[-2px] border-b-4 border-on-primary-fixed-variant transition-all duration-100" href="#">

<span class="font-label-caps text-[12px]">Phần thưởng</span>
</a>
<!-- Inactive Tab -->
<a class="flex flex-col items-center justify-center text-outline dark:text-outline-variant px-4 py-2 hover:bg-primary-fixed dark:hover:bg-on-primary-fixed-variant rounded-xl transition-colors" href="#">
<span class="material-symbols-outlined mb-1" data-icon="family_restroom">family_restroom</span>
<span class="font-label-caps text-[12px]">Bố mẹ</span>
</a>
</nav>
<script>
        function handleCorrectAnswer(btn) {
            // Remove border hover effects
            btn.classList.remove('hover:border-tertiary-container');
            btn.classList.add('border-secondary', 'bg-secondary-fixed');
            
            // Show success overlay
            const overlay = btn.querySelector('.success-overlay');
            if (overlay) {
                overlay.classList.remove('opacity-0');
                overlay.classList.add('opacity-100');
            }

            // Optional: Play a sound or trigger a small animation
            btn.style.transform = 'scale(1.05)';
            setTimeout(() => {
                btn.style.transform = 'scale(1)';
            }, 200);
        }
    </script>
