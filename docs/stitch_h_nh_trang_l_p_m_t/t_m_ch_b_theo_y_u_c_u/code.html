<style>
        .clay-button {
            border-bottom: 4px solid var(--tw-colors-on-primary-fixed-variant, #763300);
            transition: all 0.1s ease;
        }
        .clay-button:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }
        .clay-card {
            box-shadow: 0 4px 20px rgba(255, 140, 66, 0.05);
        }
        .letter-circle {
            border-bottom: 6px solid;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .letter-circle:active, .letter-circle.correct-anim {
            transform: translateY(4px) scale(0.95);
            border-bottom-width: 2px;
        }
        .letter-circle.correct {
            background-color: theme('colors.secondary-fixed');
            border-color: theme('colors.on-secondary-fixed-variant');
            color: theme('colors.on-secondary-fixed');
        }
        .letter-circle.incorrect {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
            opacity: 0.7;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in {
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
    </style>

<img alt="Sóc Nâu" class="w-full h-full object-cover" data-alt="A cute, friendly brown squirrel character with large expressive eyes, rendered in a soft 3D claymorphic style with bright lighting. The squirrel is wearing a small green backpack and looking encouragingly at the viewer." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCdawJ6vSer-GWBEKfYe6uH3FBU1R37igaySUZVJmHm5UpYZdS_3eJ3ErP3L9NxUOCbhNepaUGG0fQ4p19hjLh4D2s3AmziLMCc8Ie-8FkDY9qWilN6csk1et7cmE02N0rTksIy3Lcv8bSZEm4iofrQZj0SlRgMvC4HL5MHxI16FD-yIsszrXyx5BzA48WzApBE-rjq1qnDRqIxGdkDFj_7Wyqfz_xzVSg1noUUSk05s_-RedpJ8fp1yw"/>

<p class="font-title-md text-title-md text-on-surface mb-2">Bé hãy tìm tất cả chữ <strong class="text-primary text-3xl font-display-hero align-middle ml-1">B</strong> nhé!</p>
<button class="flex items-center gap-2 text-tertiary font-title-md hover:bg-tertiary-container hover:text-on-tertiary-container rounded-full px-4 py-2 transition-colors mt-2">

<!-- Background Decoration (Soft, abstract shapes) -->

<style>

<span class="material-symbols-outlined mb-1 text-2xl">home</span>

<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-6 py-2 border-b-2 border-on-secondary-container w-touch-target-min h-touch-target-min" href="#">
<span class="material-symbols-outlined mb-1 text-2xl" style="font-variation-settings: 'FILL' 1;">menu_book</span>

<script>
        const letters = [
            { char: 'A', bg: 'bg-error-container', border: 'border-[#ba1a1a]', text: 'text-on-error-container' },
            { char: 'B', bg: 'bg-surface-container-highest', border: 'border-outline', text: 'text-on-surface', isTarget: true },
            { char: 'C', bg: 'bg-tertiary-fixed', border: 'border-on-tertiary-fixed-variant', text: 'text-on-tertiary-container' },
            { char: 'B', bg: 'bg-surface-container-highest', border: 'border-outline', text: 'text-on-surface', isTarget: true },
            { char: 'D', bg: 'bg-primary-fixed', border: 'border-on-primary-fixed-variant', text: 'text-on-primary-fixed' },
            { char: 'B', bg: 'bg-surface-container-highest', border: 'border-outline', text: 'text-on-surface', isTarget: true }
        ];

        const grid = document.getElementById('letter-grid');
        let targetCount = letters.filter(l => l.isTarget).length;
        let foundCount = 0;

        letters.forEach((item, index) => {
            const btn = document.createElement('button');
            btn.className = `letter-circle w-24 h-24 md:w-32 md:h-32 rounded-full flex items-center justify-center font-display-hero text-display-hero ${item.bg} ${item.border} ${item.text} mx-auto cursor-pointer select-none pop-in relative`;
            btn.style.animationDelay = `${index * 0.1}s`;
            
            // Inner content wrapper
            const content = document.createElement('span');
            content.textContent = item.char;
            btn.appendChild(content);

            // Checkmark icon (hidden initially)
            const icon = document.createElement('span');
            icon.className = 'material-symbols-outlined absolute -top-2 -right-2 bg-secondary text-on-secondary rounded-full p-1 opacity-0 transition-opacity transform scale-50 shadow-md';
            icon.style.fontVariationSettings = "'FILL' 1";
            icon.textContent = 'check_circle';
            btn.appendChild(icon);

            btn.addEventListener('click', () => {
                if (btn.classList.contains('correct')) return; // Already found

                if (item.isTarget) {
                    btn.classList.add('correct', 'correct-anim');
                    icon.classList.remove('opacity-0', 'scale-50');
                    icon.classList.add('opacity-100', 'scale-100');
                    foundCount++;

                    // Add a tiny star pop effect here if desired

                    if (foundCount === targetCount) {
                        setTimeout(() => {
                            document.getElementById('success-message').classList.remove('hidden');
                        }, 500);
                    }
                } else {
                    btn.classList.remove('incorrect'); // Reset animation
                    void btn.offsetWidth; // Trigger reflow
                    btn.classList.add('incorrect');
                }
            });

            grid.appendChild(btn);
        });
    </script>
