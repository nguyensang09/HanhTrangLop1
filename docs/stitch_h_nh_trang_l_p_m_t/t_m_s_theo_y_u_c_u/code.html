            border-color: theme('colors.error');
            color: theme('colors.on-error-container');
            animation: shake 0.5s;
        }

        @keyframes shake {

<script>
        let foundCount = 0;
        const totalToFind = 3;

        function checkNumber(element, number, isCorrect) {
            // Prevent multiple clicks on the same element
            if (element.classList.contains('selected') || element.classList.contains('wrong')) return;

            if (isCorrect) {
                element.classList.add('selected');
                foundCount++;
                
                // Update progress
                document.getElementById('found-count').innerText = foundCount;
                const progressPercentage = (foundCount / totalToFind) * 100;
                document.getElementById('progress-bar').style.width = `${progressPercentage}%`;

                // Add stars floating animation here in a real app
                
                if (foundCount === totalToFind) {
                    setTimeout(() => {
                        document.getElementById('success-message').classList.remove('hidden');
                    }, 500);
                }
            } else {
                element.classList.add('wrong');
                setTimeout(() => {
                    element.classList.remove('wrong');
                }, 500); // Remove wrong class after animation finishes
            }
        }
    </script>
