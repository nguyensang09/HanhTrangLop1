<script>
        // Simple confetti logic for the celebratory feel
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('confetti-container');
            const colors = ['#53b5df', '#ff8c42', '#27e0a9', '#ffb68d', '#fbf9f1'];
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                
                // Randomize properties
                const left = Math.random() * 100;
                const animDuration = Math.random() * 3 + 2;
                const animDelay = Math.random() * 2;
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                // Assign styles
                confetti.style.left = `${left}%`;
                confetti.style.backgroundColor = color;
                confetti.style.animation = `confettiFall ${animDuration}s ease-in ${animDelay}s forwards`;
                
                // Randomize shape (circle or square)
                if (Math.random() > 0.5) {
                    confetti.style.borderRadius = '50%';
                }
                
                container.appendChild(confetti);
            }
        });
    </script>
