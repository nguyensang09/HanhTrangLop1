<!DOCTYPE html>

<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .clay-button {
            box-shadow: 0 4px 0 0 rgba(0,0,0,0.2);
            transition: all 0.1s ease-in-out;
        }
        .clay-button:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 0 rgba(0,0,0,0.2);
        }
        .soft-card-shadow {
            box-shadow: 0 4px 20px rgba(255,140,66,0.05);
        }
        .draggable-item {
            cursor: grab;
        }
        .draggable-item:active {
            cursor: grabbing;
        }

<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md overflow-x-hidden">
<!-- TopAppBar -->
<header class="bg-surface-container dark:bg-surface-container-high docked full-width top-0 bg-surface-container-high border-b-4 border-surface-dim shadow-sm flex justify-between items-center w-full px-container-margin py-unit z-40 sticky">
<button aria-label="Go back" class="w-[48px] h-[48px] flex items-center justify-center text-primary dark:text-primary-fixed hover:scale-105 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[28px]" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary dark:text-primary-fixed font-display-hero text-display-hero text-primary dark:text-primary-fixed">Sóc Nâu Học Tập</h1>
<div class="flex items-center gap-1 bg-surface-bright rounded-full px-3 py-1.5 border-2 border-primary-container text-primary font-title-md">
<span>125</span>
<span class="material-symbols-outlined text-[20px] text-primary" data-icon="star">star</span>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col px-container-margin py-6 pb-32 gap-6 max-w-2xl mx-auto w-full relative z-10">
<!-- Sóc Nâu Dialogue (Instruction) -->
<section class="bg-[#FFF4D2] border-2 border-[#FFE082] rounded-3xl p-4 flex items-start gap-4 soft-card-shadow relative overflow-hidden">
<div class="w-16 h-16 rounded-full bg-white border-2 border-[#FFE082] flex-shrink-0 flex items-center justify-center overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A cute, 2D vector illustration of a friendly brown squirrel wearing a tiny red scarf. The style is soft, flat colors, child-friendly, no outlines, warm and inviting. Light background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBpZ2HS0fy_zYssHrLCcJhLgyEprQfzBdFqSMjZNxOxAUxFle6GDvGWp9kw0Ek0Dfg3Vg-tu19XVCjlf3vafX7Hbt0CRw6XqSRv3k0RmDNc_VITNv_dKWV1fPcH8OWYeRiWCfdUHzbMtl-SxLhTpyAX0pzt5syTxgqTR-vqp1MImdSiiR3OcPmfIA0WnB3iAmDdX5W5F4mM2CsPEb3UyY_1DJndzI_C_DvoV5ln8_gcojGd7Dzch8koIg"/>
</div>
<div class="flex-grow flex flex-col justify-center pt-1">
<p class="font-title-md text-on-surface mb-2 leading-tight">
                    Bé hãy cho 1 quả táo vào giỏ đỏ, sau đó cho 1 quả cam vào giỏ xanh nhé!
                </p>
<button aria-label="Nghe lại yêu cầu" class="clay-button bg-primary-container text-on-primary self-start rounded-full px-4 py-2 flex items-center gap-2">
<span class="material-symbols-outlined" data-icon="volume_up">volume_up</span>
<span class="font-label-caps">Nghe Lại</span>
</button>
</div>
</section>
<!-- Play Area: Baskets & Fruits -->
<section class="flex-grow flex flex-col gap-8 justify-center">
<!-- Target Baskets -->
<div class="flex justify-around items-end gap-4 h-48 w-full">
<!-- Red Basket -->
<div class="flex flex-col items-center gap-2 w-1/2">
<div aria-label="Giỏ đỏ" class="w-32 h-32 bg-error-container border-4 border-[#ffb4ab] rounded-b-3xl rounded-t-lg relative flex items-end justify-center pb-2 shadow-inner border-t-0">
<!-- Decorative Basket Weave pattern placeholder -->
<div class="absolute inset-0 opacity-20 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCI+CjxwYXRoIGQ9Ik0wIDEwaTIwdjEwSDB6IiBmaWxsPSIjMDAwIi8+CjxwYXRoIGQ9Ik0xMCAwaDEwdjEwSDEweiIgZmlsbD0iI2ZmZiIvPgo8L3N2Zz4=')]"></div>
<span class="font-title-md text-error z-10 bg-white/80 px-3 py-1 rounded-full">Giỏ Đỏ</span>
</div>
</div>
<!-- Blue Basket (Greenish-Blue based on theme) -->
<div class="flex flex-col items-center gap-2 w-1/2">
<div aria-label="Giỏ xanh" class="w-32 h-32 bg-tertiary-container border-4 border-tertiary-fixed-dim rounded-b-3xl rounded-t-lg relative flex items-end justify-center pb-2 shadow-inner border-t-0">
<!-- Decorative Basket Weave pattern placeholder -->
<div class="absolute inset-0 opacity-20 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCI+CjxwYXRoIGQ9Ik0wIDEwaTIwdjEwSDB6IiBmaWxsPSIjMDAwIi8+CjxwYXRoIGQ9Ik0xMCAwaDEwdjEwSDEweiIgZmlsbD0iI2ZmZiIvPgo8L3N2Zz4=')]"></div>
<span class="font-title-md text-on-tertiary-container z-10 bg-white/80 px-3 py-1 rounded-full">Giỏ Xanh</span>
</div>
</div>
</div>
<!-- Fruit Tray (Draggable Items) -->
<div class="bg-surface-container-high rounded-3xl p-6 border-4 border-surface-dim soft-card-shadow flex flex-col items-center gap-4 relative">
<div class="absolute -top-4 left-1/2 -translate-x-1/2 bg-surface text-on-surface-variant font-label-caps px-4 py-1 rounded-full border-2 border-surface-dim shadow-sm">
                    Khay Trái Cây
                </div>
<div class="flex flex-wrap justify-center gap-4 w-full pt-4">
<!-- Apple -->
<div aria-label="Quả Táo" class="draggable-item w-20 h-20 bg-white rounded-full border-2 border-surface-variant shadow-sm flex items-center justify-center p-2 hover:scale-105 active:scale-95 transition-transform">
<img class="w-full h-full object-contain pointer-events-none" data-alt="A stylized 2D icon of a bright red apple with a small green leaf. Soft claymorphism style, no harsh outlines, rounded edges, child-friendly design. Light mode background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCB_pPGjAybGuR5lrllBpXVbhGJdRDtddKJ7KUR69x-SrV6pzS2d9rhbv45mrJf0vnjB6KMeWKq3dOm0vGN92mmsx2oOXVFCjfut5H-z2rsO3ZqviQX_PObjmahK3kUV751FO0s3DEjW_mA5npOmn3zCmD7jTJ_bCgck43UFsBChozf4R_FovsrPoOGSbq-tHCXV82IZfLB7u0GE0lX0js4bWTpCKUgJ2n-5QhoIk9c2nllOfyQed9cuA"/>
</div>
<!-- Orange -->
<div aria-label="Quả Cam" class="draggable-item w-20 h-20 bg-white rounded-full border-2 border-surface-variant shadow-sm flex items-center justify-center p-2 hover:scale-105 active:scale-95 transition-transform">
<img class="w-full h-full object-contain pointer-events-none" data-alt="A stylized 2D icon of a bright orange with a textured peel and a small green leaf. Soft claymorphism style, no harsh outlines, rounded edges, child-friendly design. Light mode background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCY6rRZvUwZ8a1ncRqLdeX7-M0MdX99y5aGmAnopnviqvyD5Ltd5xG8GaRnc10J4BZI-_u92M0Y06hh4dzP1_jMjPNtznxKcX4DPqKaONFua8e2jJIv1Zvt1JqwACoUytbnN0TINjfgiKBbonoP1Z1j-hhcvRIRwr4qEH8vXso0qi0qO5o-3FHRGhr6F8rrFmu736q_Ue4mb82z3_jJ4ca8JI7TX_IeasdGe7e5Hn4LgR_rAtMxrj3q_A"/>
</div>
<!-- Banana -->
<div aria-label="Quả Chuối" class="draggable-item w-20 h-20 bg-white rounded-full border-2 border-surface-variant shadow-sm flex items-center justify-center p-2 hover:scale-105 active:scale-95 transition-transform">
<img class="w-full h-full object-contain pointer-events-none" data-alt="A stylized 2D icon of a yellow banana. Soft claymorphism style, no harsh outlines, rounded edges, child-friendly design. Light mode background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCEYQQSI3A3OwA3lAVknNLeo0GGTYSV09O4ibcDioxT9sbADKQOTA6jhUsTmo9hC91TQ4EjXR5TslBXXp_3nBYsZ6wXoDRSdezsqtUPIesCBaX349qu1LTB_4ySn0WdhYuAXTMXfZEYkbj0WYfYCDBo5a4RAijKFgVHYqxQVP4tkGNOs-MKbwePFF1weCTGiApy_pVR-ygkYdSY3Fq2MCa3P4aV8TerQcTtwRAQZHjLUPFL1FOQVaL_QQ"/>
</div>
<!-- Extra Apple for distractor -->
<div aria-label="Quả Táo Khác" class="draggable-item w-20 h-20 bg-white rounded-full border-2 border-surface-variant shadow-sm flex items-center justify-center p-2 hover:scale-105 active:scale-95 transition-transform">
<img class="w-full h-full object-contain pointer-events-none" data-alt="A stylized 2D icon of a bright red apple with a small green leaf. Soft claymorphism style, no harsh outlines, rounded edges, child-friendly design. Light mode background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCY4KaJkOoXkju3KvQ4mFE_8fTbo2fPM5gH4-tkA05iRa896Vw3yv7iuAEoZSvFGz-bHCYDcJL4swEfhn96P3TuCMp_5_tfxiF0NGDms33BoIkx8Cc-ZOzLI8mKuRo-dZrXPgItcg9XmULSBEvsYzmG1siIgocCdKteAdB2BxI99qTVRv0wrENwnYWear2e86l0Jn76FXB_BNBDbPN1xCQxFtZiEHS6mU9VGV5Wxj5pGf9Lb1EZ36xoJA"/>
</div>
</div>
</div>
</section>
<!-- Submit/Next Action (Initially hidden or disabled until task complete) -->
<div class="flex justify-center mt-4">
<button class="clay-button bg-primary text-on-primary font-headline-lg-mobile px-12 py-4 rounded-full flex items-center gap-2 opacity-50 cursor-not-allowed" disabled="">
                 Hoàn Thành
                 <span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
</button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-4 pt-2 bg-surface dark:bg-surface-container-lowest border-t-2 border-surface-variant shadow-[0_-4px_20px_rgba(255,140,66,0.05)] rounded-t-xl">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-2 hover:bg-primary-fixed dark:hover:bg-primary-fixed-variant group transition-colors rounded-xl min-w-[64px] min-h-[64px]">
<span class="material-symbols-outlined text-[28px] mb-1 group-hover:scale-110 transition-transform" data-icon="home">home</span>
<span class="font-label-caps text-label-caps text-center">Trang chủ</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary text-on-primary-container dark:text-on-primary rounded-xl px-4 py-2 border-b-4 border-on-primary-fixed-variant hover:bg-primary-fixed dark:hover:bg-primary-fixed-variant Active: translate-y-1 transition-all duration-100 min-w-[64px] min-h-[64px]">
<span class="material-symbols-outlined text-[28px] mb-1" data-icon="menu_book" data-weight="fill">menu_book</span>
<span class="font-label-caps text-label-caps text-center">Bài tập</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-2 hover:bg-primary-fixed dark:hover:bg-primary-fixed-variant group transition-colors rounded-xl min-w-[64px] min-h-[64px]">
<span class="material-symbols-outlined text-[28px] mb-1 group-hover:scale-110 transition-transform" data-icon="workspace_premium">workspace_premium</span>
<span class="font-label-caps text-label-caps text-center">Phần thưởng</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-2 hover:bg-primary-fixed dark:hover:bg-primary-fixed-variant group transition-colors rounded-xl min-w-[64px] min-h-[64px]">
<span class="material-symbols-outlined text-[28px] mb-1 group-hover:scale-110 transition-transform" data-icon="family_history">family_history</span>
<span class="font-label-caps text-label-caps text-center">Bố mẹ</span>
</button>
</nav>
