<script>
        // Simple interaction script
        const groupBtns = document.querySelectorAll('.group-select');
        groupBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                // Reset all
                groupBtns.forEach(b => {
                    b.classList.remove('border-primary', 'bg-primary-fixed/20');
                    b.classList.add('border-outline-variant', 'bg-surface');
                });
                // Set active
                this.classList.remove('border-outline-variant', 'bg-surface');
                this.classList.add('border-primary', 'bg-primary-fixed/20');
            });
        });
