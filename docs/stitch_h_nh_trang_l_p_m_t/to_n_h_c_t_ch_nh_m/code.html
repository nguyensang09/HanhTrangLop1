<script>
        // Simple Drag and Drop Logic
        const draggables = document.querySelectorAll('.draggable');
        const dropzones = [
            document.getElementById('basket-red-content'),
            document.getElementById('basket-blue-content'),
            document.getElementById('ball-pool')
        ];
        const basketZones = [document.getElementById('basket-red'), document.getElementById('basket-blue')];
        const completeBtn = document.getElementById('btn-complete');

        let draggedItem = null;

        draggables.forEach(draggable => {
            draggable.addEventListener('dragstart', () => {
                draggedItem = draggable;
                setTimeout(() => draggable.classList.add('invisible'), 0);
            });

            draggable.addEventListener('dragend', () => {
                draggedItem = null;
                draggable.classList.remove('invisible');
                checkCompletion();
            });
            
            // Touch support
            draggable.addEventListener('touchstart', (e) => {
                draggedItem = draggable;
            });
        });

        basketZones.forEach(zone => {
            zone.addEventListener('dragover', e => {
                e.preventDefault();
                zone.classList.add('drag-over');
            });
            zone.addEventListener('dragleave', () => {
                zone.classList.remove('drag-over');
            });
            zone.addEventListener('drop', e => {
                e.preventDefault();
                zone.classList.remove('drag-over');
                if (draggedItem) {
                    // Find the content div inside the basket
                    const contentDiv = zone.querySelector('div[id$="-content"]');
                    if(contentDiv) {
                        contentDiv.appendChild(draggedItem);
                    }
                }
            });
        });

        // Allow dropping back to pool
        const pool = document.getElementById('ball-pool');
        pool.addEventListener('dragover', e => e.preventDefault());
        pool.addEventListener('drop', e => {
             e.preventDefault();
             if(draggedItem) pool.appendChild(draggedItem);
        });

        function checkCompletion() {
            const poolCount = document.getElementById('ball-pool').children.length;
            if (poolCount === 0) {
                completeBtn.classList.remove('opacity-50', 'pointer-events-none');
            } else {
                completeBtn.classList.add('opacity-50', 'pointer-events-none');
            }
        }
    </script>
