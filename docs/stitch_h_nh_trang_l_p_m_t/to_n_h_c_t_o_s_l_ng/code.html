<script>
        // Simple drag and drop simulation for demonstration
        const draggables = document.querySelectorAll('.draggable');
        const dropzone = document.getElementById('dropzone');
        const countDisplay = document.getElementById('countDisplay');
        const submitBtn = document.getElementById('submitBtn');
        const targetCount = 4;
        let currentCount = 0;

        draggables.forEach(draggable => {
            draggable.addEventListener('click', () => {
                if(currentCount < 6 && !draggable.classList.contains('hidden')) {
                    draggable.classList.add('hidden');
                    currentCount++;
                    updateUI();
                }
            });
        });
        
        dropzone.addEventListener('click', () => {
            if(currentCount > 0) {
                // Find first hidden carrot and show it
                for(let i=0; i<draggables.length; i++) {
                    if(draggables[i].classList.contains('hidden')) {
                        draggables[i].classList.remove('hidden');
                        currentCount--;
                        updateUI();
                        break;
                    }
                }
            }
        });

        function updateUI() {
            countDisplay.innerText = `${currentCount}/${targetCount}`;
            if(currentCount === targetCount) {
                countDisplay.classList.remove('text-primary');
                countDisplay.classList.add('text-secondary');
                submitBtn.disabled = false;
                submitBtn.classList.remove('bg-surface-variant', 'text-on-surface-variant');
                submitBtn.classList.add('bg-primary', 'text-on-primary', 'animate-bounce');
                setTimeout(() => submitBtn.classList.remove('animate-bounce'), 1000);
            } else {
                countDisplay.classList.add('text-primary');
                countDisplay.classList.remove('text-secondary');
                submitBtn.disabled = true;
                submitBtn.classList.remove('animate-bounce');
            }
        }
    </script>
