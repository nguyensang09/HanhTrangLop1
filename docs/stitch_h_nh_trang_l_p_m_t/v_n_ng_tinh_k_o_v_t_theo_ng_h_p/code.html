<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kéo Vật Theo Đường Hẹp</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-container": "#007152",
                        "surface-variant": "#e4e3db",
                        "on-primary-container": "#6a2d00",
                        "secondary-container": "#51fac1",
                        "primary-fixed": "#ffdbc9",
                        "inverse-on-surface": "#f3f1e9",
                        "outline-variant": "#ddc1b3",
                        "surface-dim": "#dcdad2",
                        "secondary-fixed": "#54fdc4",
                        "error": "#ba1a1a",
                        "surface-container-low": "#f5f4ec",
                        "error-container": "#ffdad6",
                        "on-primary-fixed": "#331200",
                        "inverse-surface": "#30312c",
                        "surface-container-highest": "#e4e3db",
                        "surface-container": "#f0eee6",
                        "on-secondary-fixed-variant": "#00513b",
                        "secondary-fixed-dim": "#27e0a9",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#763300",
                        "tertiary-container": "#53b5df",
                        "inverse-primary": "#ffb68d",
                        "on-surface-variant": "#564338",
                        "on-tertiary-fixed": "#001f2a",
                        "tertiary-fixed": "#bfe8ff",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed": "#002116",
                        "primary": "#9b4500",
                        "on-background": "#1b1c17",
                        "on-surface": "#1b1c17",
                        "primary-container": "#ff8c42",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed-variant": "#004d65",
                        "primary-fixed-dim": "#ffb68d",
                        "surface-bright": "#fbf9f1",
                        "background": "#fbf9f1",
                        "surface-tint": "#9b4500",
                        "outline": "#897266",
                        "surface-container-high": "#eae8e0",
                        "on-tertiary-container": "#00445a",
                        "secondary": "#006c4f",
                        "tertiary-fixed-dim": "#73d2fd",
                        "tertiary": "#006686",
                        "on-secondary": "#ffffff",
                        "surface": "#fbf9f1",
                        "surface-container-lowest": "#ffffff",
                        "on-error": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "touch-target-min": "48px",
                        "container-margin": "24px",
                        "gutter": "16px",
                        "card-gap": "20px",
                        "unit": "8px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "title-md": ["Be Vietnam Pro"],
                        "body-md": ["Be Vietnam Pro"],
                        "body-lg": ["Be Vietnam Pro"],
                        "label-caps": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "display-hero": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "title-md": ["22px", { "lineHeight": "30px", "fontWeight": "600" }],
                        "body-md": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-lg": ["20px", { "lineHeight": "32px", "fontWeight": "500" }],
                        "label-caps": ["16px", { "lineHeight": "20px", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "display-hero": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "800" }]
                    }
                }
            }
        }
    </script>
<style>
        .clay-button {
            border-bottom-width: 4px;
            border-color: #7a3600; /* Darker primary */
            transition: all 0.15s ease-in-out;
        }
        .clay-button:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }
        .soft-shadow {
            box-shadow: 0 10px 20px rgba(255, 140, 66, 0.05);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col pt-16 pb-24 md:pb-0">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface-container-high w-full h-16 flex items-center justify-between px-container-margin shadow-[0_4px_0_0_rgba(228,227,219,1)]">
<button aria-label="Go back" class="w-touch-target-min h-touch-target-min flex items-center justify-center text-primary dark:text-primary-fixed-dim hover:bg-primary-container/20 active:translate-y-0.5 transition-transform rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile dark:text-surface-container-lowest flex-1 text-center font-display-hero text-title-md text-primary dark:text-primary-fixed">Vẽ theo nét</h1>
<div class="flex items-center gap-2 font-label-caps text-label-caps text-primary-container">
<span class="material-symbols-outlined text-tertiary-container" data-icon="star" data-weight="fill" style="font-variation-settings: 'FILL' 1;">star</span>
<span>125</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-container-margin py-6 flex flex-col items-center justify-center max-w-4xl mx-auto w-full relative">
<!-- Sóc Nâu Dialogue -->
<div class="bg-primary-fixed/50 border-2 border-primary-fixed rounded-2xl p-4 flex items-center gap-4 mb-8 w-full max-w-lg soft-shadow relative">
<div class="w-16 h-16 rounded-full overflow-hidden border-2 border-surface flex-shrink-0 bg-surface">
<img class="w-full h-full object-cover" data-alt="A cute, soft 3D clay-style illustration of a friendly brown squirrel character smiling brightly. The squirrel is wearing a tiny green explorer hat. The background is a solid, warm cream color. High quality, soft lighting, meant for a children's learning app interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD_NA2VZzgBJHUUDcL5SDvPYyFZbLzNhi1A1-ZEpv9KRWZcZtMgQYe2d9lhOICxtaTdN6QA1L_nTRxyQ-49l05rG5EZlDd263k1GMT2qaMYAr51p_pRUvRIW-xwXGAQQpbdiMqCrJ58kP1XBp9ZMADx49bs9dgOOWxYOhLJoF9LzO9tjY_-Ao3LM2O9SgkfhprCZmduyPvUgHi7xm8LUmoFDXJeQ3ndSwdXbIMzRMm7zkHufw_w-2wzwQ"/>
</div>
<div class="flex-1">
<p class="font-body-lg text-on-surface">Giúp chiếc xe đi theo đường về nhà nhé!</p>
</div>
<!-- Decorative tail for speech bubble effect -->
<div class="absolute -left-3 top-1/2 transform -translate-y-1/2 w-0 h-0 border-y-8 border-y-transparent border-r-8 border-r-primary-fixed"></div>
</div>
<!-- Game Area (Simulated) -->
<div class="relative w-full max-w-md h-[400px] bg-surface-container-low rounded-3xl border-2 border-surface-dim soft-shadow overflow-hidden flex flex-col justify-between items-center p-4">
<!-- Target (Home) -->
<div class="absolute top-4 w-16 h-16 bg-tertiary-fixed rounded-xl flex items-center justify-center border-2 border-tertiary-container z-10">
<span class="material-symbols-outlined text-tertiary text-[32px]" data-icon="home" data-weight="fill" style="font-variation-settings: 'FILL' 1;">home</span>
</div>
<!-- Path (SVG visualization) -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" preserveaspectratio="none" viewbox="0 0 100 100">
<!-- Outer safe zone -->
<path d="M 50 90 Q 20 65 50 50 T 50 10" fill="none" stroke="#e4e3db" stroke-linecap="round" stroke-width="20"></path>
<!-- Inner dotted path -->
<path d="M 50 90 Q 20 65 50 50 T 50 10" fill="none" stroke="#ff8c42" stroke-dasharray="2 4" stroke-linecap="round" stroke-width="4"></path>
</svg>
<!-- Obstacles -->
<div class="absolute top-1/3 left-1/4 w-8 h-8 bg-error-container rounded-full flex items-center justify-center border-2 border-error">
<span class="material-symbols-outlined text-error text-[16px]" data-icon="warning">warning</span>
</div>
<div class="absolute bottom-1/3 right-1/4 w-10 h-10 bg-error-container rounded-lg flex items-center justify-center border-2 border-error rotate-12">
<span class="material-symbols-outlined text-error text-[20px]" data-icon="landscape">landscape</span>
</div>
<!-- Draggable Object (Car) -->
<div class="absolute bottom-4 w-14 h-14 bg-secondary-container rounded-full flex items-center justify-center border-2 border-secondary shadow-lg z-10 cursor-pointer active:scale-95 transition-transform">
<span class="material-symbols-outlined text-on-secondary-container text-[28px]" data-icon="directions_car" data-weight="fill" style="font-variation-settings: 'FILL' 1;">directions_car</span>
</div>
<!-- Encouragement Toast (Hidden by default, shown for demo) -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-secondary text-on-secondary px-6 py-2 rounded-full font-title-md shadow-lg opacity-90 z-20">
                Giỏi lắm!
            </div>
</div>
<!-- Controls (Optional, for demo reset) -->
<button class="mt-8 bg-primary text-on-primary font-title-md py-3 px-8 rounded-full clay-button shadow-lg flex items-center gap-2">
<span class="material-symbols-outlined" data-icon="refresh">refresh</span>
            Chơi lại
        </button>
</main>
<!-- BottomNavBar (Mobile only) -->
<nav class="md:hidden docked full-width bottom-0 rounded-t-xl bg-surface dark:bg-surface-container shadow-[0_-4px_0_0_rgba(228,227,219,1)] fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-2 h-20">
<a aria-label="Trang chủ" class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant p-2 hover:bg-primary-fixed/30 active:translate-y-0 transition-all duration-150 rounded-xl" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-caps text-label-caps mt-1 text-[12px]">Trang chủ</span>
</a>
<a aria-current="page" aria-label="Bài tập" class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary text-on-primary-container dark:text-on-primary rounded-xl px-4 py-1 translate-y-[-2px] shadow-[0_4px_0_0_rgba(155,69,0,1)] hover:bg-primary-fixed/30 active:translate-y-0 transition-all duration-150" href="#">
<span class="material-symbols-outlined" data-icon="edit_note" data-weight="fill" style="font-variation-settings: 'FILL' 1;">edit_note</span>
<span class="font-label-caps text-label-caps mt-1 text-[12px]">Bài tập</span>
</a>
<a aria-label="Phần thưởng" class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant p-2 hover:bg-primary-fixed/30 active:translate-y-0 transition-all duration-150 rounded-xl" href="#">
<span class="material-symbols-outlined" data-icon="auto_awesome">auto_awesome</span>
<span class="font-label-caps text-label-caps mt-1 text-[12px]">Phần thưởng</span>
</a>
<a aria-label="Phụ huynh" class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant p-2 hover:bg-primary-fixed/30 active:translate-y-0 transition-all duration-150 rounded-xl" href="#">
<span class="material-symbols-outlined" data-icon="family_restroom">family_restroom</span>
<span class="font-label-caps text-label-caps mt-1 text-[12px]">Phụ huynh</span>
</a>
</nav>
</body></html>
