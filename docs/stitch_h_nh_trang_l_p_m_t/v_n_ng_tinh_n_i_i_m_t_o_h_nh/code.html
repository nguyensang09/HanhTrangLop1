<span class="material-symbols-outlined mb-1 group-hover:text-primary transition-colors" style="font-variation-settings: 'FILL' 0;">family_restroom</span>
<span class="font-label-caps text-label-caps text-[12px]">Phụ huynh</span>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const dots = Array.from(document.querySelectorAll('.dot')).sort((a, b) => parseInt(a.dataset.num) - parseInt(b.dataset.num));
            const svg = document.getElementById('lines-svg');
            let currentTarget = 1;
            let currentLine = null;
            let isDrawing = false;
            
            // Helper to get center of dot relative to container
            function getDotCenter(dot) {
                const rect = dot.getBoundingClientRect();
                const containerRect = document.getElementById('canvas-container').getBoundingClientRect();
                return {
                    x: rect.left - containerRect.left + rect.width / 2,
                    y: rect.top - containerRect.top + rect.height / 2
                };
            }

            function createLine(startX, startY) {
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', startX);
                line.setAttribute('y1', startY);
                line.setAttribute('x2', startX);
                line.setAttribute('y2', startY);
                line.classList.add('line');
                svg.appendChild(line);
                return line;
            }

            // Initially highlight first dot
            if(dots.length > 0) {
                 dots[0].style.transform = 'scale(1.1)';
                 dots[0].style.boxShadow = '0 0 15px rgba(255, 140, 66, 0.8)';
            }

            dots.forEach(dot => {
                dot.addEventListener('touchstart', handleStart, {passive: false});
                dot.addEventListener('mousedown', handleStart);
            });

            document.addEventListener('touchmove', handleMove, {passive: false});
            document.addEventListener('mousemove', handleMove);

            document.addEventListener('touchend', handleEnd);
            document.addEventListener('mouseup', handleEnd);

            function handleStart(e) {
                const dot = e.target;
                const num = parseInt(dot.dataset.num);
                
                if (num === currentTarget) {
                    e.preventDefault(); // Prevent scrolling
                    isDrawing = true;
                    dot.classList.add('connected');
                    dot.style.transform = '';
                    dot.style.boxShadow = '';
                    
                    const center = getDotCenter(dot);
                    currentLine = createLine(center.x, center.y);
                }
            }

            function handleMove(e) {
                if (!isDrawing || !currentLine) return;
                e.preventDefault(); // Prevent scrolling while drawing

                let clientX, clientY;
                if (e.type.includes('touch')) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }

                const containerRect = document.getElementById('canvas-container').getBoundingClientRect();
                const x = clientX - containerRect.left;
                const y = clientY - containerRect.top;

                currentLine.setAttribute('x2', x);
                currentLine.setAttribute('y2', y);
                
                // Check if hovering over next dot
                const nextDot = dots[currentTarget];
                if (nextDot) {
                    const nextDotRect = nextDot.getBoundingClientRect();
                    // Simple bounding box collision
                    if (clientX >= nextDotRect.left && clientX <= nextDotRect.right &&
                        clientY >= nextDotRect.top && clientY <= nextDotRect.bottom) {
                        
                        // Snap to next dot
                        const nextCenter = getDotCenter(nextDot);
                        currentLine.setAttribute('x2', nextCenter.x);
                        currentLine.setAttribute('y2', nextCenter.y);
                        
                        currentTarget++;
                        nextDot.classList.add('connected');
                        
                        // If more dots, start new line from here
                        if (currentTarget <= dots.length) {
                           currentLine = createLine(nextCenter.x, nextCenter.y);
                        } else {
                            // Finished
                            isDrawing = false;
                            finishDrawing();
                        }
                    }
                }
            }

            function handleEnd(e) {
                if (!isDrawing) return;
                isDrawing = false;
                
                // If didn't reach next dot, remove line
                if (currentLine && currentTarget <= dots.length) {
                   svg.removeChild(currentLine);
                   currentLine = null;
                   
                   // Remove connected state from current dot so they have to try again
                   dots[currentTarget-1].classList.remove('connected');
                   dots[currentTarget-1].style.transform = 'scale(1.1)';
                   dots[currentTarget-1].style.boxShadow = '0 0 15px rgba(255, 140, 66, 0.8)';
                }
            }
            
            function finishDrawing() {
                // Connect 5 back to 1 for the star
                const dot5 = dots[4];
                const dot1 = dots[0];
                const center5 = getDotCenter(dot5);
                const center1 = getDotCenter(dot1);
                
                const finalLine = createLine(center5.x, center5.y);
                finalLine.setAttribute('x2', center1.x);
                finalLine.setAttribute('y2', center1.y);
                
                // Color all lines active
                document.querySelectorAll('.line').forEach(l => l.classList.add('active'));
                
                // Play sound or show success state here
                console.log("Star completed!");
            }
        });
    </script>
