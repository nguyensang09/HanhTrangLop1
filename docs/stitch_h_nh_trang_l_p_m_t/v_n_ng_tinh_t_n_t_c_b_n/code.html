<body class="bg-background text-on-background min-h-screen font-body-md pt-16 pb-20 md:pb-0 flex flex-col">
<!-- TopAppBar -->
<header class="w-full h-16 flex items-center justify-between px-container-margin fixed top-0 w-full z-50 bg-surface dark:bg-surface-container-high bg-surface dark:bg-surface shadow-[0_4px_0_0_rgba(228,227,219,1)]">
<button class="flex items-center justify-center w-touch-target-min h-touch-target-min text-on-surface-variant hover:bg-primary-container/20 active:translate-y-0.5 transition-transform rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary dark:text-primary-fixed-dim">Vẽ theo nét</h1>
<div class="flex items-center gap-1 text-on-surface-variant font-title-md text-title-md hover:bg-primary-container/20 active:translate-y-0.5 transition-transform px-2 py-1 rounded-full cursor-pointer">
<span>⭐</span>
<span>125</span>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow p-container-margin flex flex-col items-center max-w-4xl mx-auto w-full gap-card-gap mt-4">
<!-- Sóc Nâu Dialogue -->
<div class="w-full bg-[#fdf5d3] rounded-2xl p-4 flex items-center gap-4 clay-card relative">
<div class="w-16 h-16 rounded-full overflow-hidden shrink-0 border-2 border-outline-variant bg-surface-container-lowest">

</div>
<div class="flex-grow">
<p class="font-title-md text-title-md text-on-surface">Bé hãy tô theo đường nét đứt để hoàn thành bức tranh nhé!</p>
</div>
<button class="flex-shrink-0 w-12 h-12 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center pressable border-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</button>
<div class="absolute -bottom-3 left-10 w-6 h-6 bg-[#fdf5d3] rotate-45"></div>
</div>
<!-- Drawing Canvas Area -->
<div class="w-full bg-surface-container-lowest rounded-3xl p-6 border-2 border-tertiary-fixed-dim relative clay-card aspect-video flex items-center justify-center">
<!-- Tracing Line Pattern -->
<svg class="w-full h-full max-h-[300px]" preserveaspectratio="xMidYMid meet" viewbox="0 0 500 200">
<!-- Start Point -->
<circle cx="50" cy="100" fill="#51fac1" r="12" stroke="#007152" stroke-width="4"></circle>
<!-- Dashed Line -->
<path d="M 50 100 Q 250 100 450 100" fill="none" stroke="#e4e3db" stroke-linecap="round" stroke-width="24"></path>
<path d="M 50 100 Q 250 100 450 100" fill="none" stroke="#897266" stroke-dasharray="20, 20" stroke-linecap="round" stroke-width="12"></path>
<!-- Direction Arrow -->
<polygon fill="#007152" points="120,90 140,100 120,110"></polygon>
<polygon fill="#007152" points="250,90 270,100 250,110"></polygon>
<polygon fill="#007152" points="380,90 400,100 380,110"></polygon>
<!-- End Point -->
<circle cx="450" cy="100" fill="#fdf5d3" r="16" stroke="#ff8c42" stroke-width="4"></circle>
<path d="M 445 95 L 455 105 M 455 95 L 445 105" stroke="#ff8c42" stroke-linecap="round" stroke-width="4"></path>
</svg>
<!-- Example decorative elements -->
<div class="absolute top-4 left-4">
<img class="w-16 h-16 object-contain opacity-50" data-alt="A simple, colorful 2D illustration of a cartoon cloud with a smiling face. Soft pastels, thick outlines, flat design suitable for children." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCb0kOSlt3-MXFp7_1PO_Iw6URs7P0dItZKE82o0PCEXc2MzwuQr2O1dyK_t3tsf8gUtVgWy6xoIdDCDO_Mwj26wRNNqlkwSB8dc-UlzNc8hLGKbOfydxh0O7j0cDHNOivJ5GOGHowO0CG4bEhlTsSZSx3bOF4If7PGAQnxtF-46R3esiVsH-LpJXGyhJ4YR58BcdU4aQABe04FQJ2LbJoCauMb3ERGocNKDxX9LXg88NNQHOAmGZ2dVw"/>
</div>
<div class="absolute bottom-4 right-4">
<img class="w-16 h-16 object-contain opacity-50" data-alt="A simple, colorful 2D illustration of a cartoon flower with round petals. Soft pastels, thick outlines, flat design suitable for children." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDx-Q1CWKAgiJDsZl1j1o-M0F5mUvqNKwqKOt84eC5zqRtbHOMTL4WNDhvPUdH9BmS2hf7RV_hu6HddiZnnSajt5izbB166RdHUkS2-RHYKe2AVXSWtLxsj6r1rSlVoqVEHnPJ7MgazjTFsROY4gqg2SYl27QX0oycQrEflZEXtub28gqsADatt8T1IwRWeq1w7N8LXe--l3k6Mnm6PkLqdoemtxIw_eeW_1uOmfT6rwe8CsaKLl8-Kag"/>
</div>

<span class="material-symbols-outlined">visibility</span>

<span class="material-symbols-outlined">delete</span>

            </button>
</div>

<nav class="md:hidden fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-2 h-20 bg-surface dark:bg-surface-container shadow-[0_-4px_0_0_rgba(228,227,219,1)] docked full-width bottom-0 rounded-t-xl bg-surface dark:bg-surface-container shadow-[0_-4px_20px_rgba(255,140,66,0.05)]">
<div class="flex flex-col items-center justify-center text-on-surface-variant dark:text-surface-variant p-2 hover:bg-primary-fixed/30 active:translate-y-0 transition-all duration-150 cursor-pointer">
<span class="material-symbols-outlined">home</span>
<span class="font-label-caps text-label-caps mt-1">Trang chủ</span>
