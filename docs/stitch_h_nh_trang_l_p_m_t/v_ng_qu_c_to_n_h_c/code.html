<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Vương quốc toán học</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#55fdc4",
                        "secondary": "#006c4f",
                        "warm-yellow": "#ffd54f",
                        "on-secondary-fixed": "#002116",
                        "surface": "#fbf9f1",
                        "surface-container-low": "#f6f4ec",
                        "surface-tint": "#9b4500",
                        "on-primary-fixed-variant": "#763300",
                        "on-secondary-container": "#007152",
                        "error-container": "#ffdad6",
                        "surface-bright": "#fbf9f1",
                        "on-secondary-fixed-variant": "#00513b",
                        "squirrel-brown": "#897266",
                        "tertiary-fixed-dim": "#73d2fd",
                        "on-surface-variant": "#564338",
                        "on-secondary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "primary-container": "#ff8c42",
                        "on-primary-container": "#6a2d00",
                        "secondary-fixed-dim": "#29e0a9",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed": "#001f2b",
                        "on-tertiary-container": "#00445a",
                        "primary": "#9b4500",
                        "inverse-primary": "#ffb68d",
                        "background": "#fbf9f1",
                        "error": "#ba1a1a",
                        "tertiary": "#006686",
                        "faded-path": "rgba(0, 0, 0, 0.1)",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#bfe8ff",
                        "on-primary": "#ffffff",
                        "on-primary-fixed": "#331200",
                        "on-tertiary-fixed-variant": "#004d65",
                        "surface-container-highest": "#e4e3db",
                        "success-glow": "#27e0a9",
                        "primary-fixed-dim": "#ffb68d",
                        "on-tertiary": "#ffffff",
                        "primary-fixed": "#ffdbc9",
                        "surface-dim": "#dcdad2",
                        "inverse-surface": "#30312c",
                        "on-surface": "#1b1c17",
                        "outline-variant": "#ddc1b3",
                        "tertiary-container": "#53b5df",
                        "on-background": "#1b1c17",
                        "outline": "#897266",
                        "surface-container": "#f0eee6",
                        "surface-variant": "#e4e3db",
                        "inverse-on-surface": "#f3f1e9",
                        "surface-container-high": "#eae8e0",
                        "secondary-container": "#51fac1"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "tolerance-zone": "40px",
                        "safe-margin": "32px",
                        "gutter": "24px",
                        "touch-target": "64px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Plus Jakarta Sans"],
                        "instruction-md": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "display-hero": ["Plus Jakarta Sans"],
                        "label-caps": ["Plus Jakarta Sans"],
                        "path-number": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "headline-lg": ["48px", { "lineHeight": "56px", "fontWeight": "700" }],
                        "instruction-md": ["24px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "display-hero": ["80px", { "lineHeight": "96px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "label-caps": ["18px", { "lineHeight": "24px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "path-number": ["16px", { "lineHeight": "16px", "fontWeight": "800" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .clay-button {
            border-bottom: 6px solid rgba(0,0,0,0.2);
            transition: all 0.1s;
        }
        .clay-button:active {
            border-bottom-width: 2px;
            transform: translateY(4px);
        }
        .success-glow-effect {
            box-shadow: 0 0 20px #27e0a9, inset 0 -4px 0 rgba(0,0,0,0.2);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col relative overflow-x-hidden">
<!-- Background decorative elements -->
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden opacity-50">
<span class="material-symbols-outlined text-surface-tint absolute top-10 left-10 text-6xl rotate-12">calculate</span>
<span class="material-symbols-outlined text-secondary absolute top-1/4 right-10 text-5xl -rotate-12">straighten</span>
<span class="material-symbols-outlined text-tertiary absolute bottom-1/4 left-5 text-7xl rotate-45">category</span>
<div class="absolute top-1/2 left-1/4 text-primary font-display-hero text-display-hero opacity-20 rotate-12">1</div>
<div class="absolute top-1/3 right-1/4 text-secondary font-display-hero text-display-hero opacity-20 -rotate-12">2</div>
<div class="absolute bottom-1/3 right-1/3 text-tertiary font-display-hero text-display-hero opacity-20 rotate-6">3</div>
</div>
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-dim flex justify-between items-center w-full h-touch-target px-4 w-full top-0 px-safe-margin bg-surface-container-low shadow-[0px_4px_0px_0px_#897266] z-40 fixed">
<button class="w-touch-target h-touch-target flex items-center justify-center text-primary dark:text-primary-fixed-dim hover:scale-105 active:scale-95 transition-transform duration-300">
<span class="material-symbols-outlined text-3xl">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary dark:text-primary-fixed-dim truncate px-4">Sóc Nâu Đồng Hành</h1>
<div class="text-primary dark:text-primary-fixed-dim font-instruction-md text-instruction-md font-bold px-4 py-2 bg-surface-container rounded-full flex items-center gap-1 shadow-[0px_3px_0px_0px_rgba(0,0,0,0.1)]">
            128 <span class="text-warm-yellow text-2xl">⭐</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-[80px] mb-[120px] relative w-full max-w-4xl mx-auto p-safe-margin z-10 flex flex-col items-center justify-center min-h-[800px]">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface text-center mb-8 bg-surface-bright/80 backdrop-blur-sm rounded-xl py-2 px-6 shadow-sm border-2 border-outline-variant">
            Vương quốc toán học
        </h2>
<!-- Path Map Area -->
<div class="relative w-full h-full min-h-[600px] flex items-center justify-center">
<!-- Path Line SVG (Curved line connecting nodes) -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" preserveaspectratio="xMidYMid meet" viewbox="0 0 100 100">
<path d="M 20 80 Q 50 90, 80 60 T 20 40 T 80 20" fill="none" stroke="rgba(137,114,102,0.3)" stroke-dasharray="4 2" stroke-width="2"></path>
</svg>
<!-- Level 1: Completed -->
<div class="absolute bottom-[10%] left-[20%] transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center gap-2">
<button class="w-20 h-20 bg-secondary rounded-full flex items-center justify-center clay-button success-glow-effect relative z-10">
<span class="material-symbols-outlined text-on-secondary text-4xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<span class="font-label-caps text-label-caps text-on-surface-variant bg-surface/90 px-3 py-1 rounded-full shadow-sm">Nhận biết 1-3</span>
</div>
<!-- Level 2: Current (Active) -->
<div class="absolute bottom-[40%] right-[20%] transform translate-x-1/2 -translate-y-1/2 flex flex-col items-center gap-2">
<!-- Sóc Nâu Character Indicator -->
<div class="absolute -top-16 left-1/2 transform -translate-x-1/2 animate-bounce z-20">
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center shadow-lg border-4 border-surface border-b-8">
<span class="material-symbols-outlined text-on-primary-container text-4xl">cruelty_free</span>
</div>
</div>
<button class="w-24 h-24 bg-warm-yellow rounded-full flex items-center justify-center clay-button success-glow-effect relative z-10 animate-pulse">
<span class="material-symbols-outlined text-on-surface text-5xl" style="font-variation-settings: 'FILL' 1;">star</span>
</button>
<span class="font-label-caps text-label-caps text-on-surface bg-surface/90 px-3 py-1 rounded-full shadow-sm border-2 border-warm-yellow">Tập đếm</span>
</div>
<!-- Level 3: Locked -->
<div class="absolute top-[40%] left-[20%] transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center gap-2 opacity-60">
<button class="w-20 h-20 bg-surface-variant rounded-full flex items-center justify-center border-4 border-outline-variant shadow-inner relative z-10 cursor-not-allowed">
<span class="material-symbols-outlined text-outline text-4xl">lock</span>
</button>
<span class="font-label-caps text-label-caps text-outline bg-surface/90 px-3 py-1 rounded-full shadow-sm">So sánh</span>
</div>
<!-- Level 4: Locked -->
<div class="absolute top-[10%] right-[20%] transform translate-x-1/2 -translate-y-1/2 flex flex-col items-center gap-2 opacity-60">
<button class="w-20 h-20 bg-surface-variant rounded-full flex items-center justify-center border-4 border-outline-variant shadow-inner relative z-10 cursor-not-allowed">
<span class="material-symbols-outlined text-outline text-4xl">lock</span>
</button>
<span class="font-label-caps text-label-caps text-outline bg-surface/90 px-3 py-1 rounded-full shadow-sm">Cộng trừ</span>
</div>
</div>
<!-- Sóc Nâu Feedback Overlay (Bottom Right) -->
<div class="fixed bottom-[130px] right-safe-margin bg-warm-yellow p-4 rounded-2xl rounded-br-none shadow-[0px_4px_0px_0px_#897266] max-w-[250px] z-30 flex gap-3 items-start clay-button">
<button class="bg-surface rounded-full p-2 text-primary shadow-sm active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</button>
<p class="font-instruction-md text-instruction-md text-on-surface flex-1">Cùng đếm nhé!</p>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center bg-surface pb-safe fixed bottom-0 w-full h-24 rounded-t-xl z-50 border-t-2 border-outline-variant shadow-[0px_-4px_0px_0px_rgba(0,0,0,0.05)] md:hidden">
<button class="flex flex-col items-center justify-center text-squirrel-brown px-4 py-2 hover:translate-y-1 transition-all active:translate-y-1 transition-all">
<span class="material-symbols-outlined text-3xl mb-1">home</span>
<span class="font-label-caps text-label-caps text-xs">Trang chủ</span>
</button>
<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-6 py-2 shadow-[0px_4px_0px_0px_#006c4f] active:translate-y-1 transition-all">
<span class="material-symbols-outlined text-3xl mb-1" style="font-variation-settings: 'FILL' 1;">mobile_code</span>
<span class="font-label-caps text-label-caps text-xs">Bài tập</span>
</button>
<button class="flex flex-col items-center justify-center text-squirrel-brown px-4 py-2 hover:translate-y-1 transition-all active:translate-y-1 transition-all">
<span class="material-symbols-outlined text-3xl mb-1">military_tech</span>
<span class="font-label-caps text-label-caps text-xs">Phần thưởng</span>
</button>
<button class="flex flex-col items-center justify-center text-squirrel-brown px-4 py-2 hover:translate-y-1 transition-all active:translate-y-1 transition-all">
<span class="material-symbols-outlined text-3xl mb-1">family_restroom</span>
<span class="font-label-caps text-label-caps text-xs">Bố mẹ</span>
</button>
</nav>
</body></html>
