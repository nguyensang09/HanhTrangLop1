<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Cute Cartoon Airplane for Kids -->
  <defs>
    <linearGradient id="planeYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="planeCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="planeShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#ca8a04" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g transform="rotate(-10 60 60)" filter="url(#planeShadow)">
    <!-- Tail Fin (Vertical) -->
    <path d="M 22,34 C 22,20 30,16 34,16 L 38,36 Z" fill="url(#planeCyan)"/>
    <!-- Tail Fin (Horizontal) -->
    <ellipse cx="26" cy="42" rx="14" ry="4" fill="url(#planeCyan)"/>

    <!-- Main Fuselage -->
    <path d="M 16,48 C 16,36 36,32 78,32 C 102,32 108,44 108,54 C 108,66 96,72 68,72 C 32,72 16,62 16,48 Z" fill="url(#planeYellow)"/>

    <!-- Cockpit Window -->
    <path d="M 80,36 C 88,36 94,40 96,48 L 74,48 C 74,40 76,36 80,36 Z" fill="#bae6fd"/>
    <path d="M 82,38 C 86,38 90,41 91,46 L 76,46 C 76,41 78,38 82,38 Z" fill="#ffffff" opacity="0.8"/>

    <!-- Cabin Portholes -->
    <circle cx="62" cy="48" r="5" fill="#ffffff"/>
    <circle cx="62" cy="48" r="3.5" fill="#38bdf8"/>
    <circle cx="48" cy="48" r="5" fill="#ffffff"/>
    <circle cx="48" cy="48" r="3.5" fill="#38bdf8"/>
    <circle cx="34" cy="48" r="5" fill="#ffffff"/>
    <circle cx="34" cy="48" r="3.5" fill="#38bdf8"/>

    <!-- Main Wing (Bottom/Front) -->
    <path d="M 52,56 C 54,76 66,94 76,94 C 82,94 80,78 72,56 Z" fill="url(#planeCyan)"/>

    <!-- Propeller Nose Spinner -->
    <path d="M 106,44 Q 112,54 106,62 Z" fill="#f97316"/>
    <!-- Propeller Blades (Spinning Blur) -->
    <ellipse cx="110" cy="53" rx="3" ry="16" fill="#f8fafc" opacity="0.85"/>
    <circle cx="110" cy="53" r="3.5" fill="#ea580c"/>

    <!-- Cheerful Streamer / Star -->
    <polygon points="56,36 57,38 60,38.5 58,40.5 58.5,43 56,41.5 53.5,43 54,40.5 52,38.5 55,38" fill="#ec4899"/>
  </g>
</svg>
