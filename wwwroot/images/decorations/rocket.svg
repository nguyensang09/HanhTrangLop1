<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Whimsical Space Rocket for Kids -->
  <defs>
    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="rocketRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="flameOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="rocketGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#e11d48" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g transform="rotate(25 60 60)" filter="url(#rocketGlow)">
    <!-- Blast Fire Flames -->
    <path d="M 50,88 Q 60,115 60,118 Q 60,115 70,88 Z" fill="url(#flameOrange)"/>
    <path d="M 54,88 Q 60,105 60,108 Q 60,105 66,88 Z" fill="#fef08a"/>

    <!-- Left Wing -->
    <path d="M 44,70 C 24,78 20,92 24,96 C 34,96 44,88 46,80 Z" fill="url(#rocketRed)"/>
    <!-- Right Wing -->
    <path d="M 76,70 C 96,78 100,92 96,96 C 86,96 76,88 74,80 Z" fill="url(#rocketRed)"/>

    <!-- Main Rocket Fuselage -->
    <path d="M 60,12 C 45,28 38,58 44,88 L 76,88 C 82,58 75,28 60,12 Z" fill="url(#rocketBody)"/>

    <!-- Nose Cone -->
    <path d="M 60,12 C 52,24 48,34 46,40 L 74,40 C 72,34 68,24 60,12 Z" fill="url(#rocketRed)"/>

    <!-- Engine Nozzle -->
    <rect x="50" y="86" width="20" height="6" rx="2" fill="#64748b"/>

    <!-- Porthole Window Outer -->
    <circle cx="60" cy="56" r="13" fill="#0284c7"/>
    <circle cx="60" cy="56" r="10" fill="#38bdf8"/>
    <!-- Glass Gleam -->
    <path d="M 54,50 A 7 7 0 0 1 66 50 A 7 7 0 0 0 54 50" fill="#ffffff" opacity="0.8"/>
    <circle cx="56" cy="53" r="2" fill="#ffffff"/>

    <!-- Cute decorative star on rocket -->
    <polygon points="60,70 61.5,73.5 65,74 62.5,76.5 63,80 60,78 57,80 57.5,76.5 55,74 58.5,73.5" fill="#eab308"/>
  </g>
</svg>
