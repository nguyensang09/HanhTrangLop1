<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f0" />
      <stop offset="100%" stop-color="#ffe8cc" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#804000" flood-opacity="0.15" />
    </filter>
  </defs>
  <rect x="20" y="20" width="360" height="360" rx="36" fill="url(#bgGrad)" stroke="#ffb066" stroke-width="4" filter="url(#cardShadow)" />
  <rect x="36" y="36" width="328" height="328" rx="24" fill="#ffffff" />
  <!-- Letter display -->
  <text x="200" y="150" font-family="'Be Vietnam Pro', 'Nunito', sans-serif" font-weight="800" font-size="110" fill="#e65c00" text-anchor="middle">Ă ă</text>
  <!-- Illustration: Mặt trăng khuyết & ngôi sao -->
  <circle cx="200" cy="245" r="50" fill="#ffd13b" />
  <circle cx="225" cy="235" r="45" fill="#ffffff" />
  <polygon points="160,220 165,232 178,232 168,240 172,252 160,244 148,252 152,240 142,232 155,232" fill="#ffaa00" />
  <text x="200" y="325" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="28" fill="#594333" text-anchor="middle">Mặt trăng</text>
</svg>
