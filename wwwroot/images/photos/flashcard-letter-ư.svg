<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f0" />
      <stop offset="100%" stop-color="#ffe8cc" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#804000" flood-opacity="0.15" />
    </filter>
  </defs>
  <rect x="20" y="20" width="360" height="360" rx="36" fill="url(#bgGrad)" stroke="#ffb066" stroke-width="4" filter="url(#cardShadow)" />
  <rect x="36" y="36" width="328" height="328" rx="24" fill="#ffffff" />
  <text x="200" y="150" font-family="'Be Vietnam Pro', 'Nunito', sans-serif" font-weight="800" font-size="110" fill="#00897b" text-anchor="middle">Ư ư</text>
  <!-- Illustration: Chú hươu / con sư tử con -->
  <circle cx="200" cy="245" r="32" fill="#ffb74d" />
  <!-- Mane -->
  <circle cx="172" cy="245" r="12" fill="#e65100" opacity="0.6" />
  <circle cx="228" cy="245" r="12" fill="#e65100" opacity="0.6" />
  <circle cx="200" cy="217" r="12" fill="#e65100" opacity="0.6" />
  <circle cx="180" cy="225" r="10" fill="#e65100" opacity="0.6" />
  <circle cx="220" cy="225" r="10" fill="#e65100" opacity="0.6" />
  <circle cx="190" cy="240" r="4" fill="#3e2723" />
  <circle cx="210" cy="240" r="4" fill="#3e2723" />
  <ellipse cx="200" cy="248" rx="4" ry="3" fill="#d84315" />
  <text x="200" y="325" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="28" fill="#594333" text-anchor="middle">Sư tử</text>
</svg>
