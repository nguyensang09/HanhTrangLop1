<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="socBody" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff9a3d" />
      <stop offset="70%" stop-color="#d95d08" />
      <stop offset="100%" stop-color="#9e3b00" />
    </radialGradient>
    <radialGradient id="socTummy" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fff6e8" />
      <stop offset="100%" stop-color="#fedbb2" />
    </radialGradient>
    <radialGradient id="socCheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7b89" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff7b89" stop-opacity="0" />
    </radialGradient>
    <filter id="clayShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#5a2300" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Big fluffy squirrel tail with 3D gradient -->
  <path d="M 130,165 C 195,160 210,75 165,30 C 130,-5 85,25 110,75 C 125,105 150,110 135,145 C 130,155 125,160 120,165 Z" fill="url(#socBody)" filter="url(#clayShadow)" />
  <path d="M 140,150 C 185,140 195,80 160,45 C 138,22 108,42 124,78 C 135,102 145,115 130,140 Z" fill="#ffb066" opacity="0.6" />

  <!-- Squirrel Body -->
  <ellipse cx="100" cy="140" rx="46" ry="42" fill="url(#socBody)" filter="url(#clayShadow)" />
  <!-- Tummy patch -->
  <ellipse cx="100" cy="146" rx="30" ry="28" fill="url(#socTummy)" />

  <!-- Squirrel Head -->
  <circle cx="100" cy="85" r="42" fill="url(#socBody)" filter="url(#clayShadow)" />

  <!-- Ears -->
  <ellipse cx="72" cy="48" rx="14" ry="20" fill="url(#socBody)" transform="rotate(-15, 72, 48)" />
  <ellipse cx="72" cy="49" rx="8" ry="13" fill="#fedbb2" transform="rotate(-15, 72, 49)" />
  <ellipse cx="128" cy="48" rx="14" ry="20" fill="url(#socBody)" transform="rotate(15, 128, 48)" />
  <ellipse cx="128" cy="49" rx="8" ry="13" fill="#fedbb2" transform="rotate(15, 128, 49)" />

  <!-- Fluffy ear tufts -->
  <path d="M 68,30 C 72,38 70,42 66,45 C 72,42 75,37 73,30 Z" fill="#ffb066" />
  <path d="M 132,30 C 128,38 130,42 134,45 C 128,42 125,37 127,30 Z" fill="#ffb066" />

  <!-- Face Muzzle -->
  <ellipse cx="100" cy="98" rx="26" ry="20" fill="url(#socTummy)" />

  <!-- Cheeks Blush -->
  <circle cx="72" cy="98" r="10" fill="url(#socCheek)" />
  <circle cx="128" cy="98" r="10" fill="url(#socCheek)" />

  <!-- Big sparkling Eyes (suitable for kids app) -->
  <ellipse cx="80" cy="80" rx="9" ry="12" fill="#2d1302" />
  <ellipse cx="120" cy="80" rx="9" ry="12" fill="#2d1302" />
  <!-- Eye highlights -->
  <circle cx="77" cy="76" r="4" fill="#ffffff" />
  <circle cx="83" cy="84" r="2" fill="#ffffff" />
  <circle cx="117" cy="76" r="4" fill="#ffffff" />
  <circle cx="123" cy="84" r="2" fill="#ffffff" />

  <!-- Nose -->
  <ellipse cx="100" cy="91" rx="6" ry="4.5" fill="#3a1805" />
  <ellipse cx="99" cy="90" rx="2" ry="1.5" fill="#ffffff" opacity="0.6" />

  <!-- Happy Smile & cute little buck tooth -->
  <path d="M 92,97 Q 100,105 108,97" stroke="#3a1805" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <rect x="97" y="98.5" width="6" height="5" rx="1.5" fill="#ffffff" stroke="#e0c7a8" stroke-width="0.8" />

  <!-- Cute little paws holding a golden acorn -->
  <ellipse cx="82" cy="132" rx="9" ry="8" fill="#ff9a3d" />
  <ellipse cx="118" cy="132" rx="9" ry="8" fill="#ff9a3d" />

  <!-- Acorn in hands -->
  <path d="M 94,124 Q 100,121 106,124 L 108,128 Q 100,140 92,128 Z" fill="#d49237" />
  <path d="M 92,124 Q 100,120 108,124 Q 104,121 100,121 Q 96,121 92,124 Z" fill="#7a4614" />
  <rect x="99" y="117" width="2" height="4" rx="1" fill="#7a4614" />

  <!-- Feet -->
  <ellipse cx="76" cy="176" rx="15" ry="10" fill="url(#socBody)" filter="url(#clayShadow)" />
  <ellipse cx="124" cy="176" rx="15" ry="10" fill="url(#socBody)" filter="url(#clayShadow)" />
</svg>
